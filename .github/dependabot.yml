# DIVE-7973: Dependabot SECURITY updates are on for this repo (main, 11-09).
# Their PRs used to be titled "Bump x from …", and release-cut refuses a
# non-conventional title on main, so every entry below gives them a
# conventional "fix(deps): …" title.
#
# open-pull-requests-limit: 0 turns OFF routine version-bump PRs. Security
# updates are not affected by that limit; they still open, and still take the
# commit-message prefix from the matching entry here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "fix(deps)" }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "fix(deps)" }
  - package-ecosystem: pip
    directories:
      - /python
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "fix(deps)" }
  # The Linode app's requirements.txt is Akamai's starter list, copied for the
  # pull request to their marketplace-apps repo. Nothing installs it from here
  # (their deploy script clones THEIR repo) and our playbook uses few of these
  # packages, so bumps here change nothing that runs (lodar 11-14: "so annoying
  # to bump it"). ignore also applies to security updates.
  - package-ecosystem: pip
    directory: /marketplace/linode/apps/linode-marketplace-5dive
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "fix(deps)" }
    ignore:
      - dependency-name: "*"
