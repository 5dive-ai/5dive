name: bundle-drift

# Catch "edited the bundled 5dive but forgot to edit src/" (or vice versa).
# The installer fetches the single-file 5dive directly, so the committed
# bundle must always match what build.sh produces from src/.
on:
  pull_request:
  push:
    branches: ['**']
  # DIVE-2118: dispatchable, so version-assign can trigger this after its own push.
  # A GITHUB_TOKEN push does NOT trigger workflows; workflow_dispatch is GitHub's
  # documented exception ("workflow_dispatch and repository_dispatch events always
  # create workflow runs"), which is what makes version-assign's loop-safety and its
  # commit-must-be-graded requirement compatible.
  # NOTE this ONE file carries BOTH the drift check and the version-uniqueness job,
  # so a single dispatch grades both — they are not two workflows.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild bundle from src/
        run: ./build.sh
      - name: Syntax-check the rebuilt bundle
        run: bash -n 5dive
      # DIVE-2091: the bundle is no longer committed, so the old check here
      # (`git diff --exit-code 5dive`) would pass VACUOUSLY on an untracked file —
      # a check that cannot fail, which is worse than no check. Two assertions
      # replace it, and both CAN fail.
      - name: The bundle must NOT be tracked
        run: |
          # Re-committing the generated pair re-introduces the whole defect this
          # ticket removed: every merge to main invalidating every open PR (three
          # forced rebases in one day, two on an outside contributor). Catch it on
          # the PR that does it rather than on the next person to rebase.
          for f in 5dive 5dive.sha256; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is TRACKED again. It is generated at tag time by"
              echo "::error::release-cut.yml and must stay untracked (see .gitignore)."
              exit 1
            fi
          done
          echo "5dive and 5dive.sha256 are untracked, as required"
      - name: The build must be REPRODUCIBLE (not a provenance check)
        run: |
          # Tag-time generation only works if two builds of the same source agree:
          # the tag's bundle is built on a runner, and anyone auditing it rebuilds
          # elsewhere. If that is not reproducible, the published artifact is
          # unverifiable by anyone but the machine that made it.
          #
          # WHAT THIS DOES NOT CATCH, stated so nobody reads it as more than it is
          # (dev, DIVE-2091): a STALE RECIPE. build.sh is itself a source file, so a
          # rebuild with a build.sh from one commit against src/ from another emits a
          # WRONG bundle — and does so DETERMINISTICALLY, then regenerates a matching
          # .sha256 for it. Measured: 47,779 lines instead of 48,024, the whole of
          # src/lib/capability.sh absent while its CALL SITES ship, and self-consistent
          # throughout. Build-twice-and-compare passes on that, because the same wrong
          # recipe is wrong the same way twice. This is a REPRODUCIBILITY check, not a
          # PROVENANCE one. Provenance comes from release-cut building in a single
          # detached checkout, where build.sh and src/ cannot be from different commits.
          a=$(sha256sum 5dive | cut -d' ' -f1)
          ./build.sh
          b=$(sha256sum 5dive | cut -d' ' -f1)
          if [ "$a" != "$b" ]; then
            echo "::error::build.sh is NOT deterministic ($a vs $b) — a tag-time bundle could not be independently reproduced."
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < 5dive.sha256)" != "$b" ]; then
            echo "::error::5dive.sha256 does not match the bundle build.sh just produced."
            exit 1
          fi
          echo "build is reproducible and self-consistent ($b)"

  # DIVE-2065: CI-side twin of scripts/version-bump-guard.sh's push-time check
  # (scripts/git-hooks/pre-push). Catches a version collision that bypassed
  # the local hook. The bypasses, MOST COMMON FIRST (DIVE-2072 corrected this
  # enumeration — it used to omit the first one, which is the only entry that
  # requires no mistake by anyone, and its absence told readers to trust the
  # local hook more than they should):
  #   - a branch CUT BEFORE the guard landed on main. core.hooksPath makes git
  #     run the hook from YOUR working tree, so a guard added to main is simply
  #     absent on every older branch, silently, for as long as they live. See
  #     the hook-staleness job below, which catches this at PR time.
  #   - --no-verify
  #   - a box that never ran scripts/install-pii-push-guard.sh
  #   - a race between two pushes that each looked clear against a now-stale main. Only runs on pushes that actually
  # land on main (a PR's own commits aren't reachable from main yet, and
  # CONTRIBUTING.md says PRs don't bump the version anyway) and only checks
  # the delta this push introduced — see version-uniqueness-scan.sh's own
  # header for why a full-history sweep would be permanently red instead.
  # DIVE-2072: a repo-tracked hook protects only branches that CONTAIN it, and a
  # MISSING HOOK CANNOT ANNOUNCE ITS OWN ABSENCE — so this lives in CI, which is
  # present when the hook is not, and runs at PR time where the remedy is still a
  # cheap rebase rather than a post-hoc CI catch after the damage landed.
  hook-staleness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: This branch's copy of scripts/git-hooks must not be behind main's
        run: |
          git fetch -q origin main
          bash scripts/hook-staleness-check.sh HEAD origin/main

  version-uniqueness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No commit newly on main may claim a FIVE_VERSION already used by a different bundle
        run: |
          before="${{ github.event.before }}"
          zero="0000000000000000000000000000000000000000"
          if [[ -z "$before" || "$before" == "$zero" ]] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "version-uniqueness: no usable previous main tip (new branch or force event) — skipping delta scan."
            exit 0
          fi
          # DIVE-2125: the gate, not the raw scan. version-uniqueness and version-assign
          # are triggered by the SAME push and race — measured on 186b0e3 and 6fd082e,
          # this job failed on the merge commit while the assigner was still computing
          # the repair, leaving a permanently red run on a merge that ended healthy.
          # The gate tolerates ONLY the assignable shape, and only after PROVING the
          # repair landed by re-scanning main's new tip; anything else still fails.
          ./scripts/version-uniqueness-gate.sh "${{ github.sha }}" "$before"
