# DIVE-2144: cut the release tag. This is the PUBLISH ACT.
#
# Under DIVE-2144 install.sh resolves the newest release TAG, not main HEAD. That
# moves publishing off "someone merged" and onto "someone cut a tag" — and a publish
# act with no owner is a shipping freeze. lodar answered the cadence gate 2026-07-27
# 05:16, option A: NIGHTLY AUTO-CUT WHEN MAIN CHANGED AND CI IS GREEN, PLUS A MANUAL
# CUT FOR HOTFIXES. This job is that answer.
#
# READ THIS BEFORE EDITING THE TAG NAME OR THE SORT: this job and install.sh's
# resolve_gh_tag() are ONE RULE IMPLEMENTED TWICE. install.sh accepts only
# ^v[0-9]+\.[0-9]+\.[0-9]+$ and takes `sort -V | tail -1`. If this job cuts anything
# that rule would not select, it publishes nothing while reporting success — the tag
# exists, the release page looks right, and every box keeps installing the older tag.
# So the ladder below re-implements the SAME filter and the SAME sort, and then
# ASSERTS the result actually sorts above the incumbent rather than trusting that it
# does. That assertion is the one that catches a divergence between the two copies.
#
# WHAT THIS JOB NOW ALSO DOES (DIVE-2247): it ASSIGNS FIVE_VERSION. It used not to —
# version-assign.yml owned the bump at merge and this job only published a version
# that already existed on main. That merge-time push targets a PROTECTED branch under
# github.token, which branch protection rejects and no retry can repair, so from 07-27
# to 07-30 the bot assigned nothing and eight versions were assigned by hand. Moving
# the assignment here removes the protected-main push instead of buying a credential
# that can defeat protection. version-assign.yml is retired; this job is now the ONLY
# writer of a version anywhere in the repo, which is also what retires the collision
# race it used to be possible to lose (see the derivation block below).
name: release-cut
on:
  schedule:
    # 03:00 UTC. Deliberately an hour ahead of the fleet's 04:00 self-update cron, so
    # a nightly cut is available to the boxes that same night rather than a day later.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this cut is being made by hand (hotfix, incident, first cut)'
        required: true
        type: string

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release
      checks: read      # read the CI verdict on main's tip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cut a release tag if main moved and CI is green on it
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REASON: ${{ inputs.reason }}
        run: |
          set -uo pipefail

          sha=$(git rev-parse HEAD)

          # --- the incumbent, resolved by install.sh's OWN rule -------------------
          # Same filter and same `sort -V` as resolve_gh_tag(). If these two ever
          # disagree, the assertion further down is what surfaces it.
          git fetch -q --tags origin
          incumbent=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "incumbent published tag (install.sh's rule): ${incumbent:-<none>}"

          # >>> DIVE-2247 cut-time version derivation
          #     (extracted verbatim by tests/release_cut_assign_unit.sh — keep the fences.)
          # WHY THE VERSION IS NO LONGER READ OFF MAIN. It used to be: main carried
          # FIVE_VERSION, version-assign.yml bumped it on every merge, and this job
          # read it. That push is to a PROTECTED branch under github.token, which
          # branch protection rejects and no retry can fix (DIVE-2247) — so between
          # 07-27 and 07-30 EIGHT versions were assigned by hand and the bot assigned
          # none. The fix is not a credential that can defeat protection; it is to
          # stop needing the push. Nothing writes a version to main any more. main's
          # header carries the 0.0.0-dev SENTINEL and this job assigns the real one
          # onto the detached release commit, below, before build.sh runs.
          #
          # THE COLLISION INVARIANT SURVIVES BY CONSTRUCTION, not by a detector. Two
          # bundles could claim one version (DIVE-2118) because assignment had many
          # racing writers on a shared branch. Here there is exactly ONE writer, it
          # runs once per cut, and it derives strictly upward from refs that already
          # exist. version-uniqueness was the post-hoc detector for that race; the
          # race is gone, so it goes with it rather than being relaxed (the DIVE-2185
          # rule: delete the hazard at the source rather than surrender the guard).
          #
          # THE FLOOR IS NOT DECORATION. Deriving purely from the newest TAG would
          # cut v0.17.2 next — and 0.17.2 through 0.17.8 were already assigned BY HAND
          # on main against different trees, one of which is installed on a live box.
          # Re-issuing one of those numbers is the exact DIVE-2118 failure it looks
          # like it avoids. .release-floor records that high-water mark once, at the
          # transition; after the first cut clears it the file is inert history and is
          # never edited again. Read it, never write it.
          floor=$(tr -d '[:space:]' < .release-floor 2>/dev/null) || floor=""
          if [[ ! "$floor" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.release-floor is missing or is not MAJOR.MINOR.PATCH (read '${floor}') — refusing to cut. The floor is the only thing between a fresh cut and a version already claimed by a different tree, so an unreadable floor is not a reason to guess (DIVE-2247)."
            exit 1
          fi
          base=$(printf '%s\n%s\n' "$floor" "${incumbent#v}" | sort -V | tail -1)
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::could not derive a successor from floor='${floor}' incumbent='${incumbent}' — refusing to cut."
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(( BASH_REMATCH[3] + 1 ))"
          tag="v${version}"
          echo "cut-time assignment: floor ${floor}, incumbent ${incumbent:-<none>} -> ${tag} (DIVE-2247)"

          # A derived version that ALREADY EXISTS as a tag means the derivation is
          # wrong, not that the cut should proceed — assert rather than assume, because
          # every later guard here is about the bundle, not about the number.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists but was just derived as the NEXT version. The floor/incumbent derivation is broken — refusing to cut rather than re-point a published tag (DIVE-2118)."
            exit 1
          fi
          # <<< DIVE-2247 cut-time version derivation

          # --- has main actually moved? ------------------------------------------
          # The tag no longer answers this: every cut mints a NEW version, so a tag
          # equal to main's tip can never exist. What the incumbent tag does carry is
          # its release commit's PARENT — the main sha it was cut from. That is the
          # comparand, and it is the same question as before ("is there anything new
          # to publish?") asked of a ref that still moves.
          # >>> DIVE-2247 main-moved check
          #     (extracted verbatim by tests/release_cut_assign_unit.sh — keep the fences.)
          # Getting this wrong in the permissive direction is expensive and quiet: the
          # cut would mint a NEW version every night on an unchanged main, burning a
          # number per night and republishing identical bytes under each. So the arm
          # that matters is the one asserting it DOES stop.
          if [[ -n "$incumbent" ]]; then
            cut_from=$(git rev-parse -q --verify "refs/tags/${incumbent}^{commit}^" 2>/dev/null || true)
            if [[ -n "$cut_from" && "$cut_from" == "$sha" ]]; then
              echo "::notice::${incumbent} was cut from main's current tip ${sha:0:12} — main has not moved since the last cut. Nothing to publish."
              exit 0
            fi
          fi
          # <<< DIVE-2247 main-moved check

          # --- CI verdict on THAT EXACT SHA, and it must be non-vacuous ----------
          # "no failing checks" is satisfied by "no checks at all", which is exactly
          # the state a GITHUB_TOKEN push leaves behind (token pushes do not trigger
          # workflows — see version-assign.yml). Treating that as green would publish
          # an ungraded tree at precisely the moment our grading is broken, which is
          # the failure this whole ticket exists to retire. So: count first.
          runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
                   --jq '.check_runs[] | [.name, .status, (.conclusion // "pending"), (.details_url // "")] | @tsv' 2>/dev/null)
          # >>> DIVE-2144 release-cut guard block (extracted verbatim by tests/release_cut_guards_unit.sh)
          # DIVE-2238: DROP THIS RUN'S OWN CHECK-RUNS BEFORE COUNTING ANYTHING.
          # This job runs against main's tip, so its own `cut` job is a check-run on
          # the very sha it is grading — permanently `in_progress` for as long as it
          # executes. Counting it makes the completeness guard UNSATISFIABLE BY
          # CONSTRUCTION: the job waits for itself, refuses, and would do so every
          # night on a fully green main. It failed exactly that way on its only run
          # (30332498204, 2026-07-28: "CI still IN FLIGHT ... Unfinished: cut
          # in_progress"), and 49 commits sat unpublished behind it while every box
          # kept installing v0.16.32.
          # Matched on the RUN ID in details_url, not on the job name: renaming the
          # job must not silently re-introduce the self-reference. Dropping the whole
          # run rather than just this job is the correct rule — no job of this run can
          # be a precondition for this run. Everything below is unchanged, and still
          # sees a genuinely in-flight OTHER run.
          if [[ -n "${GITHUB_RUN_ID:-}" ]]; then
            runs=$(awk -F'\t' -v self="/actions/runs/${GITHUB_RUN_ID}/" 'index($4, self) == 0' <<<"$runs")
          fi
          total=$(printf '%s' "$runs" | grep -c . || true)

          if (( total == 0 )); then
            echo "::error::CI NOT REACHED on ${sha:0:12} — ZERO check-runs exist for this commit, which is NOT the same as green. Refusing to cut ${tag}. (A GITHUB_TOKEN push does not trigger workflows; dispatch bundle-drift against main, let it complete, then re-run this job.)"
            exit 1
          fi

          incomplete=$(awk -F'\t' '$2 != "completed"' <<<"$runs")
          bad=$(awk -F'\t' '$3 != "success" && $3 != "skipped" && $3 != "neutral"' <<<"$runs" | awk -F'\t' '$2 == "completed"')

          echo "CI on ${sha:0:12}: ${total} check-run(s) (excluding this run's own)"
          printf '%s\n' "$runs" | cut -f1-3 | sed 's/^/  /'

          if [[ -n "$incomplete" ]]; then
            echo "::error::CI still IN FLIGHT on ${sha:0:12} — refusing to cut ${tag}. Unfinished:"
            printf '%s\n' "$incomplete" | sed 's/^/  /'
            exit 1
          fi
          if [[ -n "$bad" ]]; then
            echo "::error::CI is RED on ${sha:0:12} — refusing to cut ${tag}. Failing:"
            printf '%s\n' "$bad" | sed 's/^/  /'
            exit 1
          fi
          echo "CI green on ${sha:0:12}: ${total}/${total} completed, none failing."
          # <<< DIVE-2144 release-cut guard block

          # --- the candidate must WIN install.sh's sort, not merely exist ---------
          # Without this, a cut that is lexically fine but version-sorts BELOW the
          # incumbent succeeds, exits 0, and publishes precisely nothing. The tag page
          # would show it; no box would ever install it.
          # Note the tie: `sort -V | tail -1` returns its LAST input when the two are
          # equal, so a naive `winner != tag` check passes a tie. That is unreachable
          # here (the tag-exists branch above already returned), but a guard that is
          # correct only because of a precondition somewhere else stops being correct
          # the moment someone reorders the steps. Reject `<=`, not `<`.
          # >>> DIVE-2144 sort-assertion block (extracted verbatim by tests/release_cut_guards_unit.sh)
          if [[ -n "$incumbent" ]]; then
            winner=$(printf '%s\n%s\n' "$incumbent" "$tag" | sort -V | tail -1)
            if [[ "$winner" != "$tag" || "$tag" == "$incumbent" ]]; then
              echo "::error::${tag} does NOT sort above the incumbent ${incumbent} under 'sort -V', so install.sh would keep resolving ${incumbent} and this cut would publish NOTHING while succeeding. Refusing."
              exit 1
            fi
          fi
          # <<< DIVE-2144 sort-assertion block

          # --- publish -----------------------------------------------------------
          note="nightly auto-cut: main changed and CI is green (lodar 2026-07-27, cadence option A)"
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] && note="manual cut: ${MANUAL_REASON}"

          git config user.name  'lodar'
          git config user.email 'markounik@gmail.com'
          # >>> DIVE-2091 release-commit block (extracted by tests/release_cut_bundle_unit.sh)
          # The built bundle is NO LONGER COMMITTED ON MAIN. install.sh fetches
          # $REPO/5dive and $REPO/5dive.sha256 where $REPO is raw.githubusercontent
          # at the TAG's sha (DIVE-2144), so the bundle must exist in the tree THIS
          # TAG POINTS AT — and nowhere else. Main stays clean, which is the whole
          # point: a generated 47k-line file on main invalidates every open PR on
          # every merge (three forced rebases in one day, two of them on an outside
          # contributor).
          #
          # So build it here and tag a RELEASE COMMIT whose parent is main's tip.
          # Pushing the tag carries the commit's objects, so raw.githubusercontent
          # serves it even though no branch points at it.
          #
          # FAIL CLOSED, and this is the requirement that matters: a tag cut WITHOUT
          # a bundle publishes nothing while looking successful — every box would
          # keep the version it has and `install.sh` would die on the download. So
          # the asserts below run BEFORE the tag exists, and any of them aborts the
          # cut rather than producing a tag we would have to delete.
          git checkout -q --detach "$sha"
          # DIVE-2247: ASSIGN THE VERSION HERE, and it must be BEFORE build.sh.
          # build.sh copies src/header.sh into the bundle, and the assert further down
          # refuses to publish a bundle whose FIVE_VERSION disagrees with its tag. So
          # the ordering is not stylistic: bump after build and every cut fails that
          # assert; bump before build and the assert holds by construction. This write
          # lands ONLY on the detached release commit — main is never pushed to, which
          # is the whole of DIVE-2247.
          sed -i -E "s/^readonly FIVE_VERSION=\"[^\"]+\"/readonly FIVE_VERSION=\"${version}\"/" src/header.sh
          [ "$(grep -m1 -oE '^readonly FIVE_VERSION="[^"]+"' src/header.sh)" = "readonly FIVE_VERSION=\"${version}\"" ] \
            || { echo "::error::could not write FIVE_VERSION=${version} into src/header.sh (the 'readonly FIVE_VERSION=' anchor drifted?) — refusing to cut ${tag} rather than publish the sentinel"; exit 1; }
          ./build.sh || { echo "::error::build.sh failed — refusing to cut ${tag} with no bundle"; exit 1; }
          [ -s 5dive ] && [ -s 5dive.sha256 ] \
            || { echo "::error::build.sh produced no bundle/checksum — refusing to cut ${tag}"; exit 1; }
          bash -n 5dive \
            || { echo "::error::built bundle is not valid bash — refusing to cut ${tag}"; exit 1; }
          _built=$(sha256sum 5dive | cut -d" " -f1)
          _want=$(tr -d "[:space:]" < 5dive.sha256)
          [ "$_built" = "$_want" ] \
            || { echo "::error::bundle does not match its own 5dive.sha256 (${_built} vs ${_want}) — refusing to cut ${tag}"; exit 1; }
          _bundle_ver=$(grep -m1 -oP "(?<=^readonly FIVE_VERSION=\")[^\"]+" 5dive)
          [ "v${_bundle_ver}" = "$tag" ] \
            || { echo "::error::built bundle says FIVE_VERSION=${_bundle_ver} but this cut is ${tag} — refusing to publish a bundle that disagrees with its own tag"; exit 1; }
          git add -f 5dive 5dive.sha256 src/header.sh
          git -c user.name=lodar -c user.email=markounik@gmail.com \
              commit -q -m "release ${tag}: assign ${version} + built bundle (DIVE-2091 bundle-at-tag-time, DIVE-2247 version-at-tag-time)"
          sha=$(git rev-parse HEAD)
          # Prove the TREE BEING TAGGED carries what install.sh will fetch — read it
          # back out of the object store rather than trusting the working tree.
          git cat-file -e "${sha}:5dive" 2>/dev/null && git cat-file -e "${sha}:5dive.sha256" 2>/dev/null \
            || { echo "::error::release commit ${sha} does not carry the bundle — refusing to cut ${tag}"; exit 1; }
          [ "$(git show "${sha}:5dive" | sha256sum | cut -d" " -f1)" = "$_want" ] \
            || { echo "::error::bundle in the release commit differs from the one just built — refusing to cut ${tag}"; exit 1; }
          echo "release commit ${sha} carries bundle ${_want} (FIVE_VERSION=${_bundle_ver})"
          # <<< DIVE-2091 release-commit block

          git tag -a "$tag" "$sha" -m "${tag} — ${note}

          Publishes ${sha} as the tree every box installs (DIVE-2144). CI green on
          this exact sha: ${total} completed check-runs, none failing."
          if ! git push origin "refs/tags/${tag}"; then
            echo "::error::tag push rejected — ${tag} was NOT published. Nothing changed for any box; they keep installing ${incumbent:-the previous tag}."
            exit 1
          fi

          # DIVE-2091 — PROVE IT IS SERVABLE, do not assert that it is.
          #
          # Everything above proves the bundle is in the TAGGED TREE. Nothing proved it
          # is fetchable from where install.sh actually looks, and that gap got materially
          # riskier with this change rather than merely staying untested (dev, review):
          # BEFORE, GH_PINNED_SHA resolved to a commit ON MAIN — branch-reachable,
          # constantly fetched, warm. AFTER, it resolves to a release commit reachable
          # ONLY from a tag and on no branch. That is a different object class for
          # GitHub's read paths, and DIVE-1977 is the row that established those paths
          # have split-generation and propagation windows — three endpoints, one day.
          #
          # WHY IT MUST BE MEASURED HERE AND NOT LEFT TO TRUST: install.sh fails closed
          # and boxes self-update unattended on the 04:00 cron. If a window exists for
          # tag-only commits, the symptom is installs dying on the download after EVERY
          # release, discovered at the NEXT release, on customer boxes. Late and wide.
          #
          # This is the REMOTE version of the instinct already used above, where the
          # bundle is read back out of the object store with `git cat-file` rather than
          # trusted from the worktree. Same move, one hop further out.
          #
          # The tag is NOT deleted on failure. A published tag that cannot be served is
          # a state a human must see; auto-removing it would hide the one occurrence
          # that proves the window is real.
          # PROBE THE MANDATORY OBJECT, NOT THE OPTIONAL ONE (dev, review of #313).
          # install.sh:264 `curl "$REPO/5dive" || die` is FATAL. install.sh:273
          # `curl "$REPO/5dive.sha256" || _want=""` is fail-SOFT BY DESIGN — DIVE-1271
          # made an absent checksum warn rather than brick a box. The first cut of this
          # probe fetched the .sha256, so it proved the object install.sh treats as
          # OPTIONAL was servable and said nothing about the one it dies on.
          #
          # And they are two INDEPENDENT CDN objects with independent cache generations —
          # DIVE-1977 exists because they disagreed. Proving one servable is not evidence
          # about the other; that row's own finding, applied to the probe descended from
          # it. The bundle is ~2.8MB against a 65-byte checksum, and both are the only
          # genuinely NEW blobs in the release commit (everything else install.sh fetches
          # is inherited from main's tree), so object-level lag shows on the bundle first.
          _base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}"
          _tmp="$(mktemp)"
          _got=""
          for _try in 1 2 3 4 5 6; do
            curl -fsSL --max-time 60 "${_base}/5dive" -o "$_tmp" 2>/dev/null \
              && [ -s "$_tmp" ] \
              && _got="$(sha256sum "$_tmp" | awk '{print $1}')" \
              && break
            echo "  attempt ${_try}/6: ${tag} bundle not yet servable at ${sha:0:12} — waiting for propagation"
            _got=""; sleep 10
          done
          if [ -z "$_got" ]; then
            rm -f "$_tmp"
            echo "::error::${tag} IS PUBLISHED BUT ITS BUNDLE IS NOT SERVABLE. raw.githubusercontent returned nothing usable for ${_base}/5dive after 6 tries. That is the object install.sh DIES on, so every new install and every unattended self-update fails until this resolves. The tag was deliberately NOT deleted — a human needs to see this."
            exit 1
          fi
          rm -f "$_tmp"
          if [ "$_got" != "$_want" ]; then
            echo "::error::${tag} serves a DIFFERENT bundle than this cut verified. ${_base}/5dive hashes to ${_got}; the tagged tree carries ${_want}. Boxes would install bytes nobody checked."
            exit 1
          fi
          # Also confirm the two objects AGREE at this one immutable sha — DIVE-1977's own
          # prescription. install.sh reads both, and a stale .sha256 against a fresh bundle
          # is the disagreement that row was filed for.
          _servedsha="$(curl -fsSL --max-time 10 "${_base}/5dive.sha256" 2>/dev/null | tr -d '[:space:]')" || _servedsha=""
          if [ -n "$_servedsha" ] && [ "$_servedsha" != "$_want" ]; then
            echo "::error::${tag}: the served 5dive.sha256 (${_servedsha}) disagrees with the bundle this cut verified (${_want}) at ${sha:0:12}. The two CDN objects are out of step (DIVE-1977)."
            exit 1
          fi
          echo "${tag}: bundle verified SERVABLE and byte-correct at ${sha:0:12} (${_got:0:16}…) — install.sh's FATAL fetch path is proven, not assumed"

          gh release create "$tag" --title "$tag" --target "$sha" --notes "${note}

          Installed by every box via install.sh's tag resolver (DIVE-2144). Previous published tag: ${incumbent:-none}." \
            || echo "::warning::THE TAG IS PUBLISHED and boxes will take ${tag} — only the release PAGE failed to create. Not an error in the publish; create the release by hand if you want the notes."

          echo "::notice::published ${tag} at ${sha:0:12} (was ${incumbent:-none}) — this is what every box now installs"
