# DIVE-2144: cut the release tag. This is the PUBLISH ACT.
#
# Under DIVE-2144 install.sh resolves the newest release TAG, not main HEAD. That
# moves publishing off "someone merged" and onto "someone cut a tag" — and a publish
# act with no owner is a shipping freeze. lodar answered the cadence gate 2026-07-27
# 05:16, option A: NIGHTLY AUTO-CUT WHEN MAIN CHANGED AND CI IS GREEN, PLUS A MANUAL
# CUT FOR HOTFIXES. This job is that answer.
#
# READ THIS BEFORE EDITING THE TAG NAME OR THE SORT: this job and install.sh's
# resolve_gh_tag() are ONE RULE IMPLEMENTED TWICE. install.sh accepts only
# ^v[0-9]+\.[0-9]+\.[0-9]+$ and takes `sort -V | tail -1`. If this job cuts anything
# that rule would not select, it publishes nothing while reporting success — the tag
# exists, the release page looks right, and every box keeps installing the older tag.
# So the ladder below re-implements the SAME filter and the SAME sort, and then
# ASSERTS the result actually sorts above the incumbent rather than trusting that it
# does. That assertion is the one that catches a divergence between the two copies.
#
# WHAT THIS JOB NOW ALSO DOES (DIVE-2247): it ASSIGNS FIVE_VERSION. It used not to —
# version-assign.yml owned the bump at merge and this job only published a version
# that already existed on main. That merge-time push targets a PROTECTED branch under
# github.token, which branch protection rejects and no retry can repair, so from 07-27
# to 07-30 the bot assigned nothing and eight versions were assigned by hand. Moving
# the assignment here removes the protected-main push instead of buying a credential
# that can defeat protection. version-assign.yml is retired; this job is now the ONLY
# writer of a version anywhere in the repo, which is also what retires the collision
# race it used to be possible to lose (see the derivation block below).
name: release-cut
on:
  schedule:
    # DIVE-2466 ARM 1 — OFF THE TOP OF THE HOUR, AND ARMED TWICE.
    #
    # This was `0 3 * * *` in all six revisions of this file, and the top of the hour
    # is the slot GitHub documents as worst for `schedule`: it delays, and sometimes
    # drops, under load. Our own two schedule runs are the signature —
    #   cron 03:00Z -> actually started 2026-07-28 05:43:31Z  (+163 min)
    #   cron 03:00Z -> actually started 2026-07-29 05:47:58Z  (+168 min)
    #   2026-07-30  -> no run created at all
    #
    # The delay also silently voided this slot's OWN rationale, which used to read
    # "an hour ahead of the fleet's 04:00 self-update, so a nightly cut is available
    # to the boxes that same night". At +163 min the cut landed 05:43 — AFTER the
    # fleet had already self-updated. The stated reason for 03:00 had never once held
    # in practice, so moving the slot repairs the rationale as well as the schedule.
    #
    # 02:37 keeps the cut ahead of the fleet's 04:00 self-update even after the polling
    # window below — BUT ONLY IF THE SCHEDULE FIRES NEAR ITS SLOT, and that is exactly
    # the assumption this ticket disproved for 03:00. Caught by olivia grading it: at
    # the measured +163/+168 min delay a 02:37 cron starts ~05:20 and polls to ~06:05,
    # past the self-update, voiding this rationale the same way the old one was voided.
    #
    # SO READ THIS SENTENCE AS A PROBABILITY, NOT A GUARANTEE. Moving off the top of the
    # hour improves the odds — that slot is the one GitHub documents as worst — and it
    # buys nothing certain. IF THE DELAY PERSISTS, THE REAL FIX IS ORDERING, NOT ANOTHER
    # QUIET MINUTE: make the boxes' self-update depend on the cut having happened (or the
    # cut publish before the window rather than merely earlier in it), instead of picking
    # a time and hoping. Do not re-tune the minute a third time and call it fixed.
    #
    # The 03:43 re-arm exists for the DROPPED-run case, not the delayed one, and is safe
    # BY CONSTRUCTION rather than by a new guard: this job already exits 0 early when the
    # incumbent tag was cut from main's current tip ("main has not moved since the last
    # cut"), so a redundant run is a cheap no-op. The `concurrency` group below
    # (cancel-in-progress: false) means the re-arm can never race the primary — at worst
    # it queues behind it and then no-ops.
    - cron: '37 2 * * *'
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this cut is being made by hand (hotfix, incident, first cut)'
        required: true
        type: string
      level:
        description: 'Which component to increment. patch = the nightly behaviour. minor/major DECLARE AN EPOCH and are only correct when the headline capability has landed.'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release
      checks: read      # read the CI verdict on main's tip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cut a release tag if main moved and CI is green on it
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REASON: ${{ inputs.reason }}
          RELEASE_LEVEL: ${{ inputs.level }}
        run: |
          set -uo pipefail

          sha=$(git rev-parse HEAD)

          # --- the incumbent, resolved by install.sh's OWN rule -------------------
          # Same filter and same `sort -V` as resolve_gh_tag(). If these two ever
          # disagree, the assertion further down is what surfaces it.
          git fetch -q --tags origin
          incumbent=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "incumbent published tag (install.sh's rule): ${incumbent:-<none>}"

          # >>> DIVE-2247 cut-time version derivation
          #     (extracted verbatim by tests/release_cut_assign_unit.sh — keep the fences.)
          # WHY THE VERSION IS NO LONGER READ OFF MAIN. It used to be: main carried
          # FIVE_VERSION, version-assign.yml bumped it on every merge, and this job
          # read it. That push is to a PROTECTED branch under github.token, which
          # branch protection rejects and no retry can fix (DIVE-2247) — so between
          # 07-27 and 07-30 EIGHT versions were assigned by hand and the bot assigned
          # none. The fix is not a credential that can defeat protection; it is to
          # stop needing the push. Nothing writes a version to main any more. main's
          # header carries the 0.0.0-dev SENTINEL and this job assigns the real one
          # onto the detached release commit, below, before build.sh runs.
          #
          # THE COLLISION INVARIANT SURVIVES BY CONSTRUCTION, not by a detector. Two
          # bundles could claim one version (DIVE-2118) because assignment had many
          # racing writers on a shared branch. Here there is exactly ONE writer, it
          # runs once per cut, and it derives strictly upward from refs that already
          # exist. version-uniqueness was the post-hoc detector for that race; the
          # race is gone, so it goes with it rather than being relaxed (the DIVE-2185
          # rule: delete the hazard at the source rather than surrender the guard).
          #
          # THE FLOOR IS NOT DECORATION. Deriving purely from the newest TAG would
          # cut v0.17.2 next — and 0.17.2 through 0.17.8 were already assigned BY HAND
          # on main against different trees, one of which is installed on a live box.
          # Re-issuing one of those numbers is the exact DIVE-2118 failure it looks
          # like it avoids. .release-floor records that high-water mark once, at the
          # transition; after the first cut clears it the file is inert history and is
          # never edited again. Read it, never write it.
          floor=$(tr -d '[:space:]' < .release-floor 2>/dev/null) || floor=""
          if [[ ! "$floor" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.release-floor is missing or is not MAJOR.MINOR.PATCH (read '${floor}') — refusing to cut. The floor is the only thing between a fresh cut and a version already claimed by a different tree, so an unreadable floor is not a reason to guess (DIVE-2247)."
            exit 1
          fi
          base=$(printf '%s\n%s\n' "$floor" "${incumbent#v}" | sort -V | tail -1)
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::could not derive a successor from floor='${floor}' incumbent='${incumbent}' — refusing to cut."
            exit 1
          fi
          _maj="${BASH_REMATCH[1]}" _min="${BASH_REMATCH[2]}" _pat="${BASH_REMATCH[3]}"
          # DIVE-2539: WHICH COMPONENT MOVES. This used to be patch-only, unconditionally,
          # and that was invisible for its whole life because every cut since DIVE-2247 has
          # been a patch — a capability that was never built reads exactly like one that
          # works until the day it has different work. v0.18's headline verb (whoami,
          # DIVE-2517) landed and the epoch could not be declared: major and minor were
          # copied verbatim from the base, so 0.18.0 was unreachable from any path, and the
          # fleet would have kept installing 0.17.x builds that already contained the work.
          #
          # RELEASE_LEVEL reaches this block through `env:` rather than through an
          # Actions expression template. That is deliberate and it is also load-bearing
          # for the harness: tests/release_cut_assign_unit.sh extracts these bytes and
          # runs them, so anything the runner substitutes before bash sees it would be
          # ungradeable. NOTE FOR ANYONE EDITING THIS COMMENT: do NOT write an Actions
          # expression delimiter literally anywhere in a `run:` block, not even inside a
          # shell comment — substitution happens before the shell exists, so an empty or
          # malformed one makes the whole workflow unparseable (it did, DIVE-2539).
          # so this block stays pure bash and tests/release_cut_assign_unit.sh can keep
          # extracting and RUNNING these exact bytes rather than grading a copy.
          # Unset (the nightly schedule, which declares no input) means patch, so the
          # scheduled path is behaviourally identical to before this change.
          # DO NOT ADD `set -e` TO THIS STEP. It runs under `set -uo pipefail` on purpose,
          # which is why every refusal below is an EXPLICIT `exit 1` rather than a bare
          # failing command. tests/release_cut_assign_unit.sh evals these same bytes, and
          # its mutation grade depends on it: removing the explicit exit on an unknown
          # level turns a refusal into a silent patch derivation and reddens exactly ONE
          # arm. Under `set -e` that arm would still pass for the wrong reason, and the
          # refusal would look pinned when it was only incidentally covered. (olivia,
          # DIVE-2539.)
          _level="${RELEASE_LEVEL:-patch}"
          case "$_level" in
            patch) version="${_maj}.${_min}.$(( _pat + 1 ))" ;;
            minor) version="${_maj}.$(( _min + 1 )).0" ;;
            major) version="$(( _maj + 1 )).0.0" ;;
            *) echo "::error::RELEASE_LEVEL='${_level}' is not patch|minor|major — refusing to guess which component to move."; exit 1 ;;
          esac
          # The floor/incumbent base is the highest version ALREADY CLAIMED, so a successor
          # that does not sort strictly above it would re-issue a number against a different
          # tree (DIVE-2118). patch cannot fail this; a wrong minor/major arithmetic can, and
          # this is the arm that catches it before a tag exists rather than after.
          if [[ "$(printf '%s\n%s\n' "$base" "$version" | sort -V | tail -1)" != "$version" || "$version" == "$base" ]]; then
            echo "::error::derived ${version} does not sort strictly above the claimed base ${base} at level '${_level}' — refusing to cut (DIVE-2118)."
            exit 1
          fi
          tag="v${version}"
          echo "cut-time assignment: floor ${floor}, incumbent ${incumbent:-<none>} -> ${tag} (DIVE-2247)"

          # A derived version that ALREADY EXISTS as a tag means the derivation is
          # wrong, not that the cut should proceed — assert rather than assume, because
          # every later guard here is about the bundle, not about the number.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists but was just derived as the NEXT version. The floor/incumbent derivation is broken — refusing to cut rather than re-point a published tag (DIVE-2118)."
            exit 1
          fi
          # <<< DIVE-2247 cut-time version derivation

          # --- has main actually moved? ------------------------------------------
          # The tag no longer answers this: every cut mints a NEW version, so a tag
          # equal to main's tip can never exist. What the incumbent tag does carry is
          # its release commit's PARENT — the main sha it was cut from. That is the
          # comparand, and it is the same question as before ("is there anything new
          # to publish?") asked of a ref that still moves.
          # >>> DIVE-2247 main-moved check
          #     (extracted verbatim by tests/release_cut_assign_unit.sh — keep the fences.)
          # Getting this wrong in the permissive direction is expensive and quiet: the
          # cut would mint a NEW version every night on an unchanged main, burning a
          # number per night and republishing identical bytes under each. So the arm
          # that matters is the one asserting it DOES stop.
          # DIVE-3170: NOT "${incumbent}^". A cut makes TWO commits (DIVE-2603 split
          # assign from bundle), so the tag's first parent is the ASSIGN commit — a
          # release tree, never main. scripts/release-cut-baseline.sh holds the one
          # copy of the rule (walk first-parent to the first ancestor of main) and
          # every site below uses THIS variable rather than respelling it.
          cut_from=""
          if [[ -n "$incumbent" ]]; then
            cut_from=$(bash scripts/release-cut-baseline.sh "refs/tags/${incumbent}" 2>/dev/null || true)
            if [[ -n "$cut_from" && "$cut_from" == "$sha" ]]; then
              echo "::notice::${incumbent} was cut from main's current tip ${sha:0:12} — main has not moved since the last cut. Nothing to publish."
              exit 0
            fi
          fi
          # <<< DIVE-2247 main-moved check

          # --- CI verdict on THAT EXACT SHA, and it must be non-vacuous ----------
          # "no failing checks" is satisfied by "no checks at all", which is exactly
          # the state a GITHUB_TOKEN push leaves behind (token pushes do not trigger
          # workflows — see version-assign.yml). Treating that as green would publish
          # an ungraded tree at precisely the moment our grading is broken, which is
          # the failure this whole ticket exists to retire. So: count first.
          # DIVE-2466: the read is a FUNCTION because the guard below now looks more
          # than once. Defined outside the fenced block on purpose — the block is
          # extracted and executed by tests/release_cut_guards_unit.sh, which supplies
          # its own `_ci_fetch_runs` stub, so a poll cannot reach the network there and
          # a deleted stub fails loudly instead of grading nothing.
          _ci_fetch_runs() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "pending"), (.details_url // "")] | @tsv' 2>/dev/null
          }
          runs=$(_ci_fetch_runs)
          # >>> DIVE-2144 release-cut guard block (extracted verbatim by tests/release_cut_guards_unit.sh)
          # DIVE-2238: DROP THIS RUN'S OWN CHECK-RUNS BEFORE COUNTING ANYTHING.
          # This job runs against main's tip, so its own `cut` job is a check-run on
          # the very sha it is grading — permanently `in_progress` for as long as it
          # executes. Counting it makes the completeness guard UNSATISFIABLE BY
          # CONSTRUCTION: the job waits for itself, refuses, and would do so every
          # night on a fully green main. It failed exactly that way on its only run
          # (30332498204, 2026-07-28: "CI still IN FLIGHT ... Unfinished: cut
          # in_progress"), and 49 commits sat unpublished behind it while every box
          # kept installing v0.16.32.
          # Matched on the RUN ID in details_url, not on the job name: renaming the
          # job must not silently re-introduce the self-reference. Dropping the whole
          # run rather than just this job is the correct rule — no job of this run can
          # be a precondition for this run. Everything below is unchanged, and still
          # sees a genuinely in-flight OTHER run.
          # DIVE-2466 ARM 2 — POLL, DO NOT REFUSE ON THE FIRST LOOK.
          #
          # Both refusals below used to fire on a single read, which turns a TRANSIENT
          # into a SKIPPED DAY: a nightly that lands while CI on the newest merge is
          # still running publishes nothing, and every box keeps the previous tag for
          # 24h. The 07-29 refusal was CORRECT on an unverified tree — that property is
          # not being traded away here. ONLY THE NUMBER OF LOOKS CHANGES:
          #   * RED still refuses IMMEDIATELY and is never waited out.
          #   * a deadline expiry still exits non-zero, with the same two messages.
          #   * green still requires at least one check-run — absence is never green.
          # The `CI NOT REACHED` branch is in scope for the same reason, and it is easy
          # to miss: its own error text told a human to "let it complete, then re-run
          # this job", which is precisely the retry the job declined to do itself.
          #
          # THE BOUND IS A HARDCODED CEILING THE ENV KNOB CAN ONLY TIGHTEN (the DIVE-2412
          # shape). A caller that could WIDEN it could park this job on a runner for
          # hours; a caller that tightens it only makes the guard refuse sooner, which is
          # the safe direction. A non-numeric or over-ceiling value falls back to the
          # ceiling rather than being trusted.
          _POLL_CEILING=2700          # 45 min, not caller-settable
          _poll_max="${RELEASE_CUT_POLL_SECONDS:-$_POLL_CEILING}"
          [[ "$_poll_max" =~ ^[0-9]+$ ]] || _poll_max="$_POLL_CEILING"
          (( _poll_max > _POLL_CEILING )) && _poll_max="$_POLL_CEILING"
          _poll_int="${RELEASE_CUT_POLL_INTERVAL:-60}"
          [[ "$_poll_int" =~ ^[1-9][0-9]*$ ]] || _poll_int=60
          _poll_started=$SECONDS
          _look=0
          while :; do
            _look=$(( _look + 1 ))
            # DIVE-2466 iter2 (olivia's reject): dropping only THIS RUN's check-runs
            # is not enough — a SIBLING release-cut on the same sha poisons this one.
            # Measured 07-31: the 02:37 primary failed its release-commit self-grade
            # and left a COMPLETED, FAILED check-run named `cut` on the sha. The 03:43
            # re-arm read 13 rows instead of 12, the extra one being that corpse, and
            # refused in 9s with "CI is RED — Failing: cut". So the re-arm is a no-op
            # when it is not needed and a GUARANTEED hard-fail when it is, and it is
            # SELF-LATCHING: the RED branch exits before any polling (correct for a
            # real red), so it cannot be waited out, and the poison persists on that
            # sha for every later run. One failed cut permanently reds the sha against
            # its own workflow. The ticket's "safe BY CONSTRUCTION" claim for the
            # re-arm assumed the primary SUCCEEDED — the negation of the only case the
            # re-arm exists for.
            #
            # THE RULE: no run of THIS workflow is ever a precondition for this one.
            # Self OR sibling, a release-cut never grades a release-cut. Everything
            # else keeps failing closed exactly as before.
            #
            # WHY THE NAME IS LEARNED FROM THE API AND NOT HARDCODED. DIVE-2238 chose
            # run-id matching precisely so renaming the job could not silently
            # re-introduce the self-reference, and that concern is right — a literal
            # `cut` here would rot the moment someone renames the job or adds a `name:`
            # to it, and it would rot SILENTLY, which is the same failure shape one
            # door over. So the self row is looked up by run id (unforgeable) and its
            # NAME is read off that row; siblings are then dropped by that name. A
            # rename changes both sides at once and cannot desync them.
            # EVIDENCE ONLY, NO ${GITHUB_JOB} FALLBACK. An earlier revision of this
            # fell back to ${GITHUB_JOB} when the self row was not yet in the API
            # response. That was wrong twice over. Principle: it drops rows on a
            # GUESS at our name, and it fires precisely in the case where we have no
            # evidence for that guess — so the one situation it exists for is the one
            # situation it cannot be trusted in. Practice: it made this block read an
            # AMBIENT env var, and on a GitHub runner ${GITHUB_JOB} is set to the
            # CALLING job's name. tests/release_cut_guards_unit.sh went 40/0 locally
            # and 30/10 in CI, because the unit-tests job is named `test`, the
            # fixtures contain rows named `test`, and this line deleted them.
            # If our own row is absent we drop nothing extra and behave exactly as
            # before this change (run-id filter only). In real execution the check-run
            # exists before the step runs, so the fallback bought nothing.
            _self_name=""
            if [[ -n "${GITHUB_RUN_ID:-}" ]]; then
              _self_name=$(awk -F'\t' -v self="/actions/runs/${GITHUB_RUN_ID}/" 'index($4, self) { print $1; exit }' <<<"$runs")
              runs=$(awk -F'\t' -v self="/actions/runs/${GITHUB_RUN_ID}/" 'index($4, self) == 0' <<<"$runs")
              if [[ -n "$_self_name" ]]; then
                runs=$(awk -F'\t' -v jn="$_self_name" '$1 != jn' <<<"$runs")
              fi
            fi
            total=$(printf '%s' "$runs" | grep -c . || true)
            incomplete=$(awk -F'\t' '$2 != "completed"' <<<"$runs")
            bad=$(awk -F'\t' '$3 != "success" && $3 != "skipped" && $3 != "neutral"' <<<"$runs" | awk -F'\t' '$2 == "completed"')

            echo "CI on ${sha:0:12}: ${total} check-run(s) (excluding every run of this workflow) [look ${_look}]"
            printf '%s\n' "$runs" | cut -f1-3 | sed 's/^/  /'

            # RED FIRST, and it exits before any deadline arithmetic — a red verdict is
            # final, so waiting on it could only delay a refusal that is already correct.
            # DIVE-2466: A RED WE CANNOT ATTRIBUTE IS NOT A RED WE CAN ACT ON.
            # The sibling drop above is conditional on learning our own job's NAME off
            # our own check-run row. If that row is not in the board yet, `_self_name`
            # is empty, sibling release-cut rows are NOT dropped — and the RED branch
            # below used to exit on look 1, before any re-fetch could have found it.
            # MEASURED 2026-08-02 against the pristine block, self row absent on look 1
            # and present on look 2 with a poisoned sibling `cut` throughout: RED at
            # look 1, rc=1, one look. That is the self-latching poison this ticket
            # exists to kill, surviving in the one window nobody had exercised — the
            # existing poll arms all run with GITHUB_RUN_ID UNSET, so the filter never
            # engaged in them. The comment above ("in real execution the check-run
            # exists before the step runs") may well hold; it was never measured, and
            # it is load-bearing, so the code no longer relies on it.
            # DELIBERATELY COARSE: with `_self_name` unknown we cannot tell a sibling
            # row from a third-party one, so we defer EVERY red until our own row has
            # been seen once. That delays a genuine third-party refusal by one poll
            # interval and never suppresses it — the deadline still refuses, fail-closed,
            # with the same message. Trading one interval of latency for the removal of
            # a permanent latch is the right side of that exchange.
            if [[ -n "$bad" && -n "${GITHUB_RUN_ID:-}" && -z "$_self_name" ]]; then
              echo "CI shows red on ${sha:0:12}, but our OWN check-run row is not visible yet, so sibling release-cut rows could not be dropped — NOT acting on an unattributable red; re-looking (DIVE-2466) [look ${_look}]"
              printf '%s\n' "$bad" | sed 's/^/  deferred: /'
            elif [[ -n "$bad" ]]; then
              echo "::error::CI is RED on ${sha:0:12} — refusing to cut ${tag}. Failing:"
              printf '%s\n' "$bad" | sed 's/^/  /'
              exit 1
            fi
            if (( total > 0 )) && [[ -z "$incomplete" ]]; then
              echo "CI green on ${sha:0:12}: ${total}/${total} completed, none failing."
              break
            fi
            _elapsed=$(( SECONDS - _poll_started ))
            if (( _elapsed >= _poll_max )); then
              if (( total == 0 )); then
                echo "::error::CI NOT REACHED on ${sha:0:12} — ZERO check-runs exist for this commit after ${_elapsed}s of polling, which is NOT the same as green. Refusing to cut ${tag}. (A GITHUB_TOKEN push does not trigger workflows; dispatch bundle-drift against main, let it complete, then re-run this job.)"
                exit 1
              fi
              echo "::error::CI still IN FLIGHT on ${sha:0:12} after ${_elapsed}s of polling — refusing to cut ${tag}. Unfinished:"
              printf '%s\n' "$incomplete" | sed 's/^/  /'
              exit 1
            fi
            sleep "$_poll_int"
            runs=$(_ci_fetch_runs)
          done
          # <<< DIVE-2144 release-cut guard block

          # --- the candidate must WIN install.sh's sort, not merely exist ---------
          # Without this, a cut that is lexically fine but version-sorts BELOW the
          # incumbent succeeds, exits 0, and publishes precisely nothing. The tag page
          # would show it; no box would ever install it.
          # Note the tie: `sort -V | tail -1` returns its LAST input when the two are
          # equal, so a naive `winner != tag` check passes a tie. That is unreachable
          # here (the tag-exists branch above already returned), but a guard that is
          # correct only because of a precondition somewhere else stops being correct
          # the moment someone reorders the steps. Reject `<=`, not `<`.
          # >>> DIVE-2144 sort-assertion block (extracted verbatim by tests/release_cut_guards_unit.sh)
          if [[ -n "$incumbent" ]]; then
            winner=$(printf '%s\n%s\n' "$incumbent" "$tag" | sort -V | tail -1)
            if [[ "$winner" != "$tag" || "$tag" == "$incumbent" ]]; then
              echo "::error::${tag} does NOT sort above the incumbent ${incumbent} under 'sort -V', so install.sh would keep resolving ${incumbent} and this cut would publish NOTHING while succeeding. Refusing."
              exit 1
            fi
          fi
          # <<< DIVE-2144 sort-assertion block

          # --- publish -----------------------------------------------------------
          note="nightly auto-cut: main changed and CI is green (lodar 2026-07-27, cadence option A)"
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] && note="manual cut: ${MANUAL_REASON}"

          git config user.name  'lodar'
          git config user.email 'markounik@gmail.com'
          # >>> DIVE-2091 release-commit block (extracted by tests/release_cut_bundle_unit.sh)
          # The built bundle is NO LONGER COMMITTED ON MAIN. install.sh fetches
          # $REPO/5dive and $REPO/5dive.sha256 where $REPO is raw.githubusercontent
          # at the TAG's sha (DIVE-2144), so the bundle must exist in the tree THIS
          # TAG POINTS AT — and nowhere else. Main stays clean, which is the whole
          # point: a generated 47k-line file on main invalidates every open PR on
          # every merge (three forced rebases in one day, two of them on an outside
          # contributor).
          #
          # So build it here and tag a RELEASE COMMIT whose parent is main's tip.
          # Pushing the tag carries the commit's objects, so raw.githubusercontent
          # serves it even though no branch points at it.
          #
          # FAIL CLOSED, and this is the requirement that matters: a tag cut WITHOUT
          # a bundle publishes nothing while looking successful — every box would
          # keep the version it has and `install.sh` would die on the download. So
          # the asserts below run BEFORE the tag exists, and any of them aborts the
          # cut rather than producing a tag we would have to delete.
          git checkout -q --detach "$sha"
          # DIVE-2247: ASSIGN THE VERSION HERE, and it must be BEFORE build.sh.
          # build.sh copies src/header.sh into the bundle, and the assert further down
          # refuses to publish a bundle whose FIVE_VERSION disagrees with its tag. So
          # the ordering is not stylistic: bump after build and every cut fails that
          # assert; bump before build and the assert holds by construction. This write
          # lands ONLY on the detached release commit — main is never pushed to, which
          # is the whole of DIVE-2247.
          sed -i -E "s/^readonly FIVE_VERSION=\"[^\"]+\"/readonly FIVE_VERSION=\"${version}\"/" src/header.sh
          [ "$(grep -m1 -oE '^readonly FIVE_VERSION="[^"]+"' src/header.sh)" = "readonly FIVE_VERSION=\"${version}\"" ] \
            || { echo "::error::could not write FIVE_VERSION=${version} into src/header.sh (the 'readonly FIVE_VERSION=' anchor drifted?) — refusing to cut ${tag} rather than publish the sentinel"; exit 1; }
          # DIVE-2582: FOLD changelog.d/*.md FRAGMENTS into CHANGELOG.md's top,
          # BEFORE the stamp below — same detached-commit-only rule (never main),
          # so stamp-changelog.sh sees the folded headings same as a manually-typed
          # one. Not fatal for the same reason the stamp isn't: a cut must not die
          # because a fragment drifted from the expected format.
          #
          # DIVE-2702: PASS THE ALREADY-CONSUMED BASELINE. The fold deletes fragments
          # in this detached tree only — main keeps them (DIVE-2247: no push to a
          # protected branch) — so without this the NEXT cut re-folds every fragment
          # ever written and each release's notes repeat all previous releases'.
          # DIVE-3170: this used to pass "${incumbent}^" and call itself "not a third
          # copy of the tag-resolution rule". It WAS a third copy, spelled differently,
          # and it was wrong: the tag's first parent is the assign commit, whose tree
          # the fold has ALREADY emptied, so every fragment looked unshipped and all 52
          # re-folded on every cut. It now reuses $cut_from — the one derivation, done
          # once above. Empty incumbent (first cut ever) is still passed through as
          # set-but-empty on purpose: "nothing has shipped yet, fold everything", which
          # is different from the unset auto-detect case.
          if [[ -n "${incumbent-}" && -z "${cut_from-}" ]]; then
            echo "::warning::could not resolve the main commit ${incumbent} was cut from — every already-shipped fragment will fold again and these notes will repeat previous releases' entries (DIVE-2702, DIVE-3170)"
          fi
          if _folded=$(FOLD_RELEASED_BASELINE="${cut_from-}" bash scripts/fold-changelog-fragments.sh 2>&1); then
            echo "changelog.d fragments folded for ${tag}: ${_folded} (DIVE-2582)"
          else
            echo "::warning::changelog.d fragments could not be folded for ${tag} (${_folded}) — publishing anyway"
          fi
          # DIVE-2452: STAMP THE CHANGELOG onto this release commit, same rule as the
          # FIVE_VERSION write above — the detached release tree only, never main
          # (DIVE-2247 removed this job's ability to push a protected branch, and the
          # fix was to stop needing it). At the release commit "pending" is empty by
          # construction: every section in this tree ships in this tag, so rewriting
          # every `## Unreleased` heading is correct HERE in a way it would not be on
          # main. Effect: `git show ${tag}:CHANGELOG.md` can answer "what shipped in
          # this version", which nothing could before — every heading at v0.17.9 read
          # `Unreleased`, eight of them in the first 300 lines.
          # Not fatal: a cut with an unstampable CHANGELOG is worse published with a
          # warning than not published at all, and the release BODY (below) does not
          # depend on the stamp — it is derived from the range.
          if _stamped=$(bash scripts/stamp-changelog.sh "${version}" 2>&1); then
            echo "CHANGELOG stamped for ${tag}: ${_stamped} heading(s) (DIVE-2452)"
          else
            echo "::warning::CHANGELOG could not be stamped for ${tag} (${_stamped}) — publishing anyway; the release BODY is derived from the git range and is unaffected."
          fi
          # DIVE-2603: build.sh stamps HEAD only when the tracked source tree is
          # clean. Commit every tag-time source edit BEFORE building so the stamp
          # names the exact bytes being concatenated. The bundle rides in a second
          # release commit below; therefore its stamped source commit is the tagged
          # commit's parent and ancestry remains directly checkable.
          git add -f src/header.sh
          if [ -f CHANGELOG.md ]; then git add -f CHANGELOG.md; fi
          if [ -d changelog.d ]; then git add -A -f changelog.d; fi
          git -c user.name=lodar -c user.email=markounik@gmail.com \
              commit -q -m "release ${tag}: assign ${version} before bundle build (DIVE-2247, DIVE-2603)"
          source_sha=$(git rev-parse HEAD)
          [ -z "$(git status --porcelain --untracked-files=no)" ] \
            || { echo "::error::tracked release source is dirty after commit ${source_sha} — refusing to stamp a false build identity"; exit 1; }
          ./build.sh || { echo "::error::build.sh failed — refusing to cut ${tag} with no bundle"; exit 1; }
          [ -s 5dive ] && [ -s 5dive.sha256 ] \
            || { echo "::error::build.sh produced no bundle/checksum — refusing to cut ${tag}"; exit 1; }
          bash -n 5dive \
            || { echo "::error::built bundle is not valid bash — refusing to cut ${tag}"; exit 1; }
          _built=$(sha256sum 5dive | cut -d" " -f1)
          _want=$(tr -d "[:space:]" < 5dive.sha256)
          [ "$_built" = "$_want" ] \
            || { echo "::error::bundle does not match its own 5dive.sha256 (${_built} vs ${_want}) — refusing to cut ${tag}"; exit 1; }
          _bundle_ver=$(grep -m1 -oP "(?<=^readonly FIVE_VERSION=\")[^\"]+" 5dive)
          [ "v${_bundle_ver}" = "$tag" ] \
            || { echo "::error::built bundle says FIVE_VERSION=${_bundle_ver} but this cut is ${tag} — refusing to publish a bundle that disagrees with its own tag"; exit 1; }
          _bundle_build_sha=$(grep -m1 -oP '(?<=^readonly FIVE_BUILD_SHA=")[^"]+' 5dive)
          [ "$_bundle_build_sha" = "$source_sha" ] \
            || { echo "::error::built bundle says FIVE_BUILD_SHA=${_bundle_build_sha:-missing} but its committed source is ${source_sha} — refusing to publish a false identity"; exit 1; }
          git add -f 5dive 5dive.sha256
          git -c user.name=lodar -c user.email=markounik@gmail.com \
              commit -q -m "release ${tag}: bundle built from ${source_sha} (DIVE-2091, DIVE-2603)"
          # DIVE-2433: `sha` is about to stop meaning "the commit whose check-runs we
          # read". Keep the graded one under its own name so the tag can say which
          # object each claim is about instead of silently attributing the parent's
          # CI to the release commit.
          parent_sha="$sha"
          sha=$(git rev-parse HEAD)
          # Prove the TREE BEING TAGGED carries what install.sh will fetch — read it
          # back out of the object store rather than trusting the working tree.
          git cat-file -e "${sha}:5dive" 2>/dev/null && git cat-file -e "${sha}:5dive.sha256" 2>/dev/null \
            || { echo "::error::release commit ${sha} does not carry the bundle — refusing to cut ${tag}"; exit 1; }
          [ "$(git show "${sha}:5dive" | sha256sum | cut -d" " -f1)" = "$_want" ] \
            || { echo "::error::bundle in the release commit differs from the one just built — refusing to cut ${tag}"; exit 1; }
          echo "release commit ${sha} carries bundle ${_want} (FIVE_VERSION=${_bundle_ver}, FIVE_BUILD_SHA=${_bundle_build_sha})"
          # <<< DIVE-2091 release-commit block

          # ── DIVE-2433: GRADE THE RELEASE COMMIT ──────────────────────────────
          #
          # THE GAP. Everything above proves the bundle is INTACT — it matches its own
          # sha256, it is in the tagged tree, it is byte-correct over the CDN. Not one
          # of those runs it. The release commit is pushed detached and carries ZERO
          # check-runs (measured on v0.17.10: release commit d7db754 = 0, parent
          # 2e36516 = 10), so `test`, `install-smoke` and `docker-install` never touch
          # the exact artifact customers install. Integrity is not function: a bundle
          # can hash correctly and still be broken.
          #
          # AND THE GRADE CI *DOES* PERFORM IS OF A DIFFERENT OBJECT. unit-tests.yml
          # runs `./build.sh` first, because main carries no bundle (DIVE-2091) — so it
          # grades a REBUILD, never the released artifact. Here the bundle in the tree
          # IS the artifact, which makes this the only place the real one can be run.
          #
          # WHY NOT JUST TRIGGER THE EXISTING WORKFLOWS ON THE TAG — the obvious fix,
          # and it is a NO-OP. A push authenticated with GITHUB_TOKEN does not trigger
          # workflows (GitHub's recursion guard; this file already says so at the
          # CI-NOT-REACHED refusal above). Adding `push: tags:` to unit-tests.yml would
          # look like coverage and fire never. Grading here, BEFORE the tag is pushed,
          # is also strictly better than a post-hoc check-run: a red after publication
          # is a red on bytes boxes are already installing.
          # The grade itself lives in scripts/grade-release-commit.sh — a workflow body
          # cannot be unit-tested and .github/workflows/ needs a credential most agents
          # do not hold, so the logic sits where it can be graded and repaired on the
          # normal rail (tests/grade_release_commit_unit.sh, 20 assertions). Same split
          # as scripts/pii-scan-range.sh (DIVE-2267).
          # DIVE-2524: pass the PARENT. It is what turns a 40-minute re-run of all 264
          # harnesses into a grade of the delta — the script proves `git diff parent HEAD`
          # is the release-commit set and nothing else, and only then inherits the
          # parent's check-runs for the rest. Drop this argument and the script has no
          # premise to prove, so it falls back to the full corpus rather than trusting
          # an inheritance it cannot demonstrate. The parent is already the commit whose
          # check-runs this job polled green, under its own name since DIVE-2433.
          echo "--- grading the release commit ${sha:0:12} against parent ${parent_sha:0:12} (DIVE-2433, DIVE-2524) ---"
          bash scripts/grade-release-commit.sh "${version}" "${parent_sha}"
          _grc=$?
          case "$_grc" in
            0) echo "release commit ${sha:0:12}: PASS on the exact artifact (DIVE-2433)" ;;
            1) echo "::error::${tag} was NOT published — the release commit FAILED its own grade. Boxes keep installing ${incumbent:-the previous tag}."
               exit 1 ;;
            # UNDETERMINED must refuse exactly as hard as a failure. A grader that could
            # not run tells us nothing about the artifact, and treating "could not look"
            # as "looks fine" is the defect this row exists to close.
            *) echo "::error::${tag} was NOT published — the release-commit grade could not RUN (rc=${_grc}), so this artifact is UNGRADED. That is not a pass. Boxes keep installing ${incumbent:-the previous tag}."
               exit 1 ;;
          esac
          # ── end DIVE-2433 ────────────────────────────────────────────────────

          # DIVE-2433: this message used to read "CI green on this exact sha:
          # ${total} completed check-runs" — and that was FALSE about the object it
          # names. `sha` is reassigned to the release commit above, while `total`
          # counts check-runs on the PARENT, so the tag asserted a measurement that
          # was never taken on the commit it publishes. v0.17.10 carries that claim
          # verbatim about a sha with zero check-runs. An ungraded object is a gap;
          # an ungraded object carrying a permanent, published claim that it WAS
          # graded is what stops anyone finding the gap. Say which sha was measured
          # by whom, and name the grade this job performed rather than borrowing the
          # parent's.
          git tag -a "$tag" "$sha" -m "${tag} — ${note}

          Publishes ${sha} as the tree every box installs (DIVE-2144).
          Parent ${parent_sha} carried ${total} completed check-runs, none failing.
          This release commit is not graded by GitHub CI (a GITHUB_TOKEN push does not
          trigger workflows); it was graded IN THIS JOB before publication — tests/*.sh,
          \`5dive selfcheck\`, and --version/--help run against this exact bundle."
          if ! git push origin "refs/tags/${tag}"; then
            echo "::error::tag push rejected — ${tag} was NOT published. Nothing changed for any box; they keep installing ${incumbent:-the previous tag}."
            exit 1
          fi

          # DIVE-2091 — PROVE IT IS SERVABLE, do not assert that it is.
          #
          # Everything above proves the bundle is in the TAGGED TREE. Nothing proved it
          # is fetchable from where install.sh actually looks, and that gap got materially
          # riskier with this change rather than merely staying untested (dev, review):
          # BEFORE, GH_PINNED_SHA resolved to a commit ON MAIN — branch-reachable,
          # constantly fetched, warm. AFTER, it resolves to a release commit reachable
          # ONLY from a tag and on no branch. That is a different object class for
          # GitHub's read paths, and DIVE-1977 is the row that established those paths
          # have split-generation and propagation windows — three endpoints, one day.
          #
          # WHY IT MUST BE MEASURED HERE AND NOT LEFT TO TRUST: install.sh fails closed
          # and boxes self-update unattended on the 04:00 cron. If a window exists for
          # tag-only commits, the symptom is installs dying on the download after EVERY
          # release, discovered at the NEXT release, on customer boxes. Late and wide.
          #
          # This is the REMOTE version of the instinct already used above, where the
          # bundle is read back out of the object store with `git cat-file` rather than
          # trusted from the worktree. Same move, one hop further out.
          #
          # The tag is NOT deleted on failure. A published tag that cannot be served is
          # a state a human must see; auto-removing it would hide the one occurrence
          # that proves the window is real.
          # PROBE EVERY OBJECT install.sh CAN DIE ON — and that set GREW (DIVE-2248).
          # The first cut of this probe fetched only the .sha256 and said nothing about
          # the bundle, so dev's review of #313 correctly reversed it to probe the
          # bundle. That reasoning carried a premise which is no longer safe to leave
          # standing: that `curl "$REPO/5dive.sha256" || _want=""` is fail-SOFT, so an
          # unservable checksum could not brick a box. DIVE-2248 makes a missing NETWORK
          # checksum FATAL in install.sh, which promotes the .sha256 from optional to
          # mandatory and re-scopes this probe with it.
          #
          # So BOTH are probed with the same retry budget now. A probe whose coverage was
          # derived from a policy does not update itself when the policy does, and the
          # failure is silent in the safe-looking direction: the cut goes green and the
          # box dies. Anyone tightening install.sh's fetch path must re-read THIS block.
          #
          # And they are two INDEPENDENT CDN objects with independent cache generations —
          # DIVE-1977 exists because they disagreed. Proving one servable is not evidence
          # about the other; that row's own finding, applied to the probe descended from
          # it. The bundle is ~2.8MB against a 65-byte checksum, and both are the only
          # genuinely NEW blobs in the release commit (everything else install.sh fetches
          # is inherited from main's tree), so object-level lag shows on the bundle first.
          _base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}"
          _tmp="$(mktemp)"
          _got=""
          for _try in 1 2 3 4 5 6; do
            curl -fsSL --max-time 60 "${_base}/5dive" -o "$_tmp" 2>/dev/null \
              && [ -s "$_tmp" ] \
              && _got="$(sha256sum "$_tmp" | awk '{print $1}')" \
              && break
            echo "  attempt ${_try}/6: ${tag} bundle not yet servable at ${sha:0:12} — waiting for propagation"
            _got=""; sleep 10
          done
          if [ -z "$_got" ]; then
            rm -f "$_tmp"
            echo "::error::${tag} IS PUBLISHED BUT ITS BUNDLE IS NOT SERVABLE. raw.githubusercontent returned nothing usable for ${_base}/5dive after 6 tries. That is the object install.sh DIES on, so every new install and every unattended self-update fails until this resolves. The tag was deliberately NOT deleted — a human needs to see this."
            exit 1
          fi
          rm -f "$_tmp"
          if [ "$_got" != "$_want" ]; then
            echo "::error::${tag} serves a DIFFERENT bundle than this cut verified. ${_base}/5dive hashes to ${_got}; the tagged tree carries ${_want}. Boxes would install bytes nobody checked."
            exit 1
          fi
          # Also confirm the two objects AGREE at this one immutable sha — DIVE-1977's own
          # prescription. install.sh reads both, and a stale .sha256 against a fresh bundle
          # is the disagreement that row was filed for.
          # DIVE-2248: same 6-try budget as the bundle above, and an EMPTY result is now
          # a failure rather than a skip. Previously a single 10s try with `|| _servedsha=""`
          # meant an unservable checksum satisfied this step by being absent — the exact
          # not-reached-reads-as-passed shape, guarding the object install.sh now dies on.
          _servedsha=""
          for _try in 1 2 3 4 5 6; do
            _servedsha="$(curl -fsSL --max-time 60 "${_base}/5dive.sha256" 2>/dev/null | tr -d '[:space:]')" || _servedsha=""
            [ -n "$_servedsha" ] && break
            echo "  attempt ${_try}/6: ${tag} checksum not yet servable at ${sha:0:12} — waiting for propagation"
            sleep 10
          done
          if [ -z "$_servedsha" ]; then
            echo "::error::${tag} IS PUBLISHED BUT ITS 5dive.sha256 IS NOT SERVABLE. raw.githubusercontent returned nothing for ${_base}/5dive.sha256 after 6 tries. Since DIVE-2248 install.sh REFUSES a network bundle whose checksum it cannot fetch, so every new install and every unattended self-update fails until this resolves. The tag was deliberately NOT deleted — a human needs to see this."
            exit 1
          fi
          if [ "$_servedsha" != "$_want" ]; then
            echo "::error::${tag}: the served 5dive.sha256 (${_servedsha}) disagrees with the bundle this cut verified (${_want}) at ${sha:0:12}. The two CDN objects are out of step (DIVE-1977)."
            exit 1
          fi
          echo "${tag}: bundle AND checksum verified SERVABLE and byte-correct at ${sha:0:12} (${_got:0:16}…) — both of install.sh's fatal fetch paths are proven, not assumed"

          # >>> DIVE-2452 release-notes block
          #     (extracted verbatim by tests/release_notes_unit.sh — keep the fences.)
          # DIVE-2452: THE RELEASE BODY SAYS WHAT SHIPPED, not how it was cut.
          # This used to be `--notes "${note}"`, where `note` is the CUT REASON, so
          # v0.17.0/0.17.1/0.17.9 each published 200-600 characters describing the
          # dispatch and nothing about the 76 commits inside. Derivation, its source
          # order, and why the git RANGE rather than the `Unreleased` heading text is
          # the boundary all live in scripts/release-notes.sh — where they can be
          # unit-graded (tests/release_notes_unit.sh), the same split this file
          # already uses for grade-release-commit.sh.
          #
          # `cut_from` is the main sha the incumbent tag was cut from — the same
          # comparand the main-moved check above uses, recomputed here because that
          # block returns early on the no-move path and never reaches this point.
          # DIVE-3170: $cut_from, not a fourth respelling of the tag rule. The
          # main-moved block above returns early only on the no-move path, so the
          # variable it set is still in scope and still correct here.
          _notes_from="${cut_from-}"
          _notes_file="$(mktemp)"
          if ! bash scripts/release-notes.sh "$_notes_from" "$sha" "$version" > "$_notes_file"; then
            echo "::error::${tag} IS PUBLISHED as a tag, but its release notes could not be derived from ${_notes_from:-<root>}..${sha:0:12} — refusing to create a release page whose body would describe only how the cut was dispatched (DIVE-2452). Boxes are unaffected; write the notes by hand and create the release page."
            exit 1
          fi
          {
            printf '\n---\n\n'
            printf '%s\n\n' "$note"
            printf "Installed by every box via install.sh's tag resolver (DIVE-2144). Previous published tag: %s.\n" "${incumbent:-none}"
          } >> "$_notes_file"
          gh release create "$tag" --title "$tag" --target "$sha" --notes-file "$_notes_file" \
            || echo "::warning::THE TAG IS PUBLISHED and boxes will take ${tag} — only the release PAGE failed to create. Not an error in the publish; create the release by hand if you want the notes."
          rm -f "$_notes_file"
          # <<< DIVE-2452 release-notes block

          echo "::notice::published ${tag} at ${sha:0:12} (was ${incumbent:-none}) — this is what every box now installs"
