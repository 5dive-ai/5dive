name: install-smoke

# Guard against breaking the public install path. Runs on PRs/pushes that
# touch install.sh, the 5dive bundle, agent setup helpers, or the demo
# Dockerfile. The Dockerfile is structured to RUN install.sh against a
# clean ubuntu:22.04 during image build (with systemctl stubbed) — so a
# successful `docker build` proves install.sh + the bundle + units + hooks
# + skills lay down cleanly on a fresh host. We then boot the bundle to
# confirm `5dive --version` works post-install.

on:
  # NO `paths:` FILTER ON pull_request — DELIBERATE, DIVE-2141 fallout.
  # `shellcheck` and `docker-install` are REQUIRED status checks on main. A
  # required context that does not RUN never reports, and GitHub blocks the PR
  # forever waiting for it — so a path filter here does not skip the check, it
  # makes a whole class of PR (tests-only, docs-only, workflow-only)
  # PERMANENTLY UNMERGEABLE. PR #237 was the first casualty.
  # INVARIANT: if a job is a required context, its trigger must be
  # unconditional. Cost is ~2 min of CI on PRs that could have skipped it;
  # the alternative is an unmergeable PR and a human reaching for the admin
  # bypass, which defeats the gate it was added to enforce.
  # The `push:` filter below is UNCHANGED — required checks are enforced at the
  # PR, and main pushes carry the admin bypass.
  pull_request:
  # DIVE-4139 — MERGE QUEUE. Every context in this file that is a REQUIRED status
  # check on main must also fire on `merge_group`, or the queue never receives it:
  # with a queue enabled GitHub evaluates required checks on the temporary
  # `gh-readonly-queue/main/...` merge group, and a required context that never
  # reports there holds the entry until the check-response timeout and then EVICTS
  # it. That failure is silent at the PR — the PR just never merges.
  merge_group:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - '5dive'
      - '5dive-agent-start'
      - 'src/**'
      - 'hooks/**'
      - 'skills/**'
      - 'systemd/**'
      - 'docker/Dockerfile'
      - 'plugins/**'
      - 'team-templates/**'
      - 'scripts/install-contract.sh'
      - 'projects-CLAUDE.md'
      - 'telegram-agent-CLAUDE.md'
      - '.github/workflows/install-smoke.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint install + sources + agent-start
        # DIVE-2125 (verifier): scripts/ was linted by NOTHING, so every helper the
        # CLI shells out to shipped unchecked. Widened rather than adding one file:
        # measured zero findings across scripts/*.sh at -S error, so the broad fix is
        # free today and closes the gap permanently instead of for one script.
        #
        # DIVE-3280: this step USED to lint the built bundle instead of src/, to
        # "skip --shell=bash gymnastics". That is no longer affordable, and its
        # failure mode is the expensive part.
        #
        # shellcheck's heap is SUPERLINEAR in the size of ONE parse unit. Measured
        # on main @31abaf2 with shellcheck 0.9.0:
        #
        #     src/cmd_bug.sh        341 lines ->   35 MB
        #     src/cmd_pack.sh     2,637 lines ->  265 MB
        #     src/cmd_council.sh  5,764 lines ->  372 MB
        #     src/cmd_task.sh    15,184 lines -> 3,489 MB
        #     5dive (bundle)     72,391 lines -> "shellcheck: out of memory", exit 251
        #
        # On the runner that does not surface as a lint error. The RUNNER is killed,
        # so the job ends as "The runner has received a shutdown signal" with NO file
        # and NO line named — indistinguishable from an infra flake, and NOT fixable
        # by the PR author, whose diff is innocent. PR #610 (+271 lines over a green
        # main) died that way twice while main survived at 72,246 lines: the bundle
        # was sitting ON the ceiling and any merge could tip it over.
        #
        # So: lint the SOURCES, ONE PROCESS PER FILE. That bounds the heap to the
        # largest single file rather than to the whole product, and it prints the
        # filename BEFORE linting it, so if a file ever does exhaust the runner the
        # last line of the log names the culprit instead of naming nothing.
        #
        # `bash -n` on the built bundle keeps the concatenation itself covered
        # (0.14 s, 4 MB) — parse errors are exactly the class shellcheck reported on
        # the bundle (SC1036/SC1088 on PR #463), and bash -n catches those for free.
        run: |
          # DIVE-2091: the bundle is generated at tag time and is no longer
          # committed on main, so it has to be BUILT before anything reads it
          # as a file. Without this, removing it from main turns the bundle
          # check into a "file not found" failure on every PR.
          ./build.sh
          bash -n 5dive
          rc=0
          # DIVE-4067 widened this list. `5dive-stage-fork-plugins.sh` and the two
          # `5dive-refresh-*.sh` are installed to the box and run there, and were
          # linted by nothing — the same gap DIVE-2125 closed for scripts/, one
          # directory out. Two of the four SC2318 findings below lived in the
          # stage-fork script, so the omission was load-bearing, not cosmetic.
          SHEBANG_FILES=(install.sh 5dive-agent-start build.sh
                         5dive-stage-fork-plugins.sh
                         5dive-refresh-plugins.sh 5dive-refresh-skills.sh
                         scripts/*.sh)
          # These carry a bash shebang; let shellcheck read it.
          for f in "${SHEBANG_FILES[@]}"; do
            echo "== shellcheck $f"
            shellcheck -S error "$f" || rc=1
          done
          # src/ fragments are concatenated by build.sh and carry no shebang of
          # their own, so the dialect has to be stated.
          for f in src/*.sh src/task/*.sh; do
            echo "== shellcheck $f"
            shellcheck -S error --shell=bash "$f" || rc=1
          done

          # DIVE-4067 — SC2318, AT ANY SEVERITY, IS A MERGE BLOCKER.
          #
          # 0.26.1 shipped a launcher that could not start any agent, on any box, and
          # the nightly restarts every agent after installing, so every box that took
          # it emptied itself unattended. One line in `5dive-agent-start`:
          #
          #     local dir="$HOME/.5dive" f="$dir/delivery.env" tmp
          #
          # `local` is a builtin — bash expands ALL of its arguments before performing
          # ANY of its assignments, so `$dir` resolved against the ENCLOSING scope and
          # `set -u` made it a fatal exit before the pane started.
          #
          # THIS JOB ALREADY LINTED THAT FILE, AND ALREADY HAD THE RULE. shellcheck
          # names the defect exactly — SC2318, "this assignment is used again in this
          # 'local', but won't have taken effect. Use two 'local's." It is classed a
          # WARNING, the passes above run at `-S error`, and the severity filter threw
          # it away. So this was never a missing instrument; it was a configured-off
          # one, which is the more expensive kind because the check reports green.
          #
          # A SECOND PASS RATHER THAN A LOWER `-S`. `--include` restricts to the codes
          # named, so it cannot be combined with `-S error` in one invocation without
          # losing the error coverage. And dropping the passes above to `-S warning`
          # would light up the tree at once — a gate that is red on arrival gets
          # disabled, which is why `--with-shellcheck` is still off in
          # scripts/actionlint-scan.sh. One code, promoted deliberately, stays green.
          #
          # MEASURED, and stated because it is a real cost on a REQUIRED check:
          # 82s for this pass over the file set above (shellcheck 0.9.0, agent box,
          # 2026-09-08), roughly doubling this job's shellcheck time. shellcheck's
          # heap and time are superlinear in the size of one parse unit and src/
          # carries a 15k-line file, so most of that is one file, in both passes.
          #
          # AND IT IS CLEAN TODAY, which is the only reason it can be a blocker: 4
          # findings at origin/main d36b40ce (5dive-agent-start:1695,
          # 5dive-stage-fork-plugins.sh:95 and :182, src/cmd_agent_create.sh:171),
          # all four fixed in the commit that added this pass, 0 after.
          for f in "${SHEBANG_FILES[@]}"; do
            shellcheck --include=SC2318 "$f" || rc=1
          done
          for f in src/*.sh src/task/*.sh; do
            shellcheck --include=SC2318 --shell=bash "$f" || rc=1
          done
          exit "$rc"

  # DIVE-4186 — QUEUE-TIME ONLY (115 job-s per PR). The merge queue (DIVE-4139) grades
  # `docker-install` on the `gh-readonly-queue/main/...` merge group, so its `pull_request`
  # arm was a second full `docker build` of the same tree. `merge_group` and `push` keep it.
  #
  # This does NOT contradict the "no path filter on a required context" invariant at the top
  # of this file. That rule is about a required context that can never report on the event
  # branch protection reads — an unmergeable PR. Here the context still reports on the event
  # the merge is decided on (the merge group), and on a `pull_request` it reports the
  # conclusion `skipped`, which branch protection counts as satisfied.
  #
  # THE HAZARD THAT BUYS: if the queue is ever turned OFF, a PR would merge with
  # `docker-install` never having run — skipped-as-satisfied, silently. Turning the queue
  # off means reverting this arm in the same window; `tests/queue_time_only_arms_unit.sh`
  # is what keeps the pairing visible.
  docker-install:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs install.sh against fresh ubuntu:22.04)
        run: |
          # DIVE-2091: the bundle is generated at tag time and is no longer
          # committed on main, so it has to be BUILT before anything reads it
          # as a file. docker/Dockerfile:52 `COPY 5dive …` is such a reader,
          # and it is the LAST of five: the other four (shellcheck above, and
          # three `./5dive selfcheck` sites in unit-tests.yml) were covered
          # when the bundle came off main. This one sits in the same file as
          # the shellcheck fix and inherited nothing from it, so it failed as
          # `"/5dive": not found` at image build — before the two version
          # assertions below could run at all.
          ./build.sh
          docker build -f docker/Dockerfile -t 5dive-smoke .
      - name: Verify CLI is on PATH and reports the expected version
        run: |
          docker run --rm --entrypoint /usr/local/bin/5dive 5dive-smoke --version
      - name: Verify the bundled version matches src/header.sh
        run: |
          expected=$(grep -oE '^readonly FIVE_VERSION="[^"]+"' src/header.sh | cut -d'"' -f2)
          actual=$(docker run --rm --entrypoint /usr/local/bin/5dive 5dive-smoke --version | tr -d '\n')
          # `5dive --version` may print "5dive 0.1.0" or similar — match loosely.
          if ! echo "$actual" | grep -q "$expected"; then
            echo "ERROR: installed 5dive reports '$actual', expected version '$expected'"
            exit 1
          fi
      # DIVE-4091: nothing in CI ever STARTED an agent. v0.26.1 emptied every box
      # on 2026-09-07 because `5dive-agent-start` died at line 1687 under
      # `set -euo pipefail`, and the whole ~1700-line startup path above
      # `tmux new-session` was executed by no check: the unit corpus sources
      # functions without running the launcher, and the steps above install the
      # bundle and ask it for a version string. DIVE-4067 wired the SC2318
      # shellcheck pass, which catches that bug's SYNTACTIC shape and nothing
      # else. This arm runs the launcher and asserts it reaches the
      # session it exists to create — the whole class, not one shellcheck code.
      #
      # Deterministic by construction: no network, no credential, no sleep the
      # arm does not bound, and a hard `timeout` so a launcher that hangs turns
      # this REQUIRED context red in 2 minutes instead of parking the job.
      - name: Launcher survives its own startup (behavioural, DIVE-4091)
        run: |
          cat > /tmp/launcher-arm.sh <<'ARM'
          #!/bin/bash
          set -euo pipefail
          NAME=smoketest
          CALLS=/tmp/tmux.calls

          # The launcher hard-codes /usr/bin/tmux, so shim THAT path — putting a
          # stub earlier on PATH would never be consulted.
          # has-session MUST exit non-zero: the launcher's final statement is
          #   while /usr/bin/tmux has-session -t "$SESSION"; do sleep 5; done
          # (it blocks so systemd keeps the unit active), and a stub that exits 0
          # there would hang this job until the workflow timeout.
          cat > /usr/bin/tmux <<'STUB'
          #!/bin/sh
          printf '%s\n' "$*" >> /tmp/tmux.calls
          case "$1" in has-session) exit 1 ;; *) exit 0 ;; esac
          STUB
          chmod +x /usr/bin/tmux

          # install.sh does not lay down the agent binary, and the launcher
          # refuses at `[[ -x "$BIN" ]] || exit 3` before it reaches anything
          # interesting. It only needs to be executable — it is exec'd INSIDE the
          # tmux session, which is stubbed, so nothing here runs an agent.
          install -d -m 755 /home/claude/.local/bin /home/claude/projects
          printf '#!/bin/sh\nexit 0\n' > /home/claude/.local/bin/claude
          chmod +x /home/claude/.local/bin/claude

          install -d -m 2750 /var/lib/5dive/agents.d
          printf 'AGENT_TYPE=claude\nAGENT_CHANNELS=none\nAGENT_WORKDIR=/home/claude/projects\n' \
            > /var/lib/5dive/agents.d/${NAME}.env

          # No credential is seeded, so the launcher takes its degraded-start
          # branch — the same one a freshly provisioned box takes before its
          # creds land. CLAUDE_AUTH_WAIT_SECS bounds that wait (default 45s).
          rc=0
          CLAUDE_AUTH_WAIT_SECS=1 timeout 120 /usr/local/bin/5dive-agent-start "$NAME" || rc=$?

          echo "--- tmux calls recorded ---"
          cat "$CALLS" 2>/dev/null || echo "(none)"
          echo "---------------------------"

          if [ "$rc" -eq 124 ]; then
            echo "FAIL: 5dive-agent-start did not return within 120s — it hangs during startup" >&2
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: 5dive-agent-start exited $rc — the launcher dies during its own startup." >&2
            echo "      Every managed box runs this file on every agent restart; the nightly" >&2
            echo "      restarts every agent, so shipping this empties the fleet unattended." >&2
            exit 1
          fi
          # Exit 0 is NOT the assertion. A launcher that returned early because a
          # precondition was unmet would satisfy an exit-code-only arm forever —
          # the same green-from-a-filter shape that caused the incident. Assert the
          # session was actually LAUNCHED. `new-session`, not merely "the stub was
          # touched": `tmux kill-session` runs ~500 lines earlier and would satisfy
          # any weaker check while the startup path still died.
          if ! grep -q '^new-session ' "$CALLS"; then
            echo "FAIL: launcher exited 0 without ever calling 'tmux new-session' —" >&2
            echo "      it returned before launching the session it exists to launch." >&2
            exit 1
          fi
          echo "OK: launcher ran its full startup path and launched the session"
          ARM
          chmod +x /tmp/launcher-arm.sh
          docker run --rm -v /tmp/launcher-arm.sh:/arm.sh:ro \
            --entrypoint /bin/bash 5dive-smoke /arm.sh

  # DIVE-4141 — the INSTALL CONTRACT, in its OWN job, deliberately.
  #
  # It belongs to `docker-install` by subject and MUST NOT live in it: that job
  # is a REQUIRED status check on main (see the note at the top of this file),
  # and this contract is RED on main today by design — the browser plugin
  # cannot be installed (DIVE-4126, `unknown grant 'browser-profiles'`), which
  # is the whole reason the check exists. Adding a red arm to a required
  # context makes every PR unmergeable until that fix lands, which is the
  # DIVE-2141 failure mode in a new costume: a gate that blocks everything gets
  # bypassed, and then it is not a gate.
  #
  # So it ships ADVISORY. Sequence: DIVE-4126 merges -> this job goes green ->
  # DIVE-4135 adds it to the required-contexts list. Until then a red here is a
  # signal to read, and the ONE arm that is red names its own ticket.
  #
  # It pays for its own `docker build` rather than sharing docker-install's:
  # jobs do not share a daemon, and passing the image through an artifact costs
  # more wall-clock than rebuilding it on a warm apt mirror (~90s). The
  # duplication buys the decoupling above, which is the point.
  install-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs install.sh against fresh ubuntu:22.04)
        run: |
          ./build.sh
          docker build -f docker/Dockerfile -t 5dive-contract .
      # Everything docker-install asserts is that the bundle lays down and
      # reports a version. Nothing there ever installed a bundled plugin,
      # resolved a team template, or asked a verb for its usage — so v0.28.0
      # shipped the browser plugin uninstallable (DIVE-4126) and the
      # `distribution` template unstaged (#808) with that job green. Both
      # defects are "the artifact exists and does not install/run", and only a
      # fresh-box exercise sees them.
      #
      # The two manifests are mounted from the CHECKOUT, not read out of the
      # installed tree: the repo's marketplace.json and team-templates/index.json
      # are the source of truth, so a plugin or slug that install.sh forgot to
      # stage is still enumerated and reports as missing. Read the installed
      # copies instead and install.sh becomes its own examiner.
      - name: Plugins install, templates resolve, verbs answer --help
        run: |
          docker run --rm \
            -v "$PWD/scripts/install-contract.sh:/contract.sh:ro" \
            -v "$PWD/plugins/.claude-plugin/marketplace.json:/manifests/marketplace.json:ro" \
            -v "$PWD/team-templates/index.json:/manifests/team-index.json:ro" \
            --entrypoint /bin/bash 5dive-contract /contract.sh
