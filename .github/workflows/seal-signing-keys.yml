name: seal-signing-keys
# DIVE-8014 ONE-SHOT. DELETE THIS FILE once both keys live in the `release-signing`
# environment and the repo-level copies are gone (step 5 below).
#
# WHY IT EXISTS. APT_SIGNING_KEY and OFFLINE_UPDATE_SIGNING_KEY were repo-level
# secrets, which a workflow on ANY branch can read. DIVE-7973 moved the signing jobs
# into the `release-signing` environment (deployments from main only), but the keys
# themselves still have to get there, and no copy of either exists outside GitHub
# (by design: every box pins the apt key, and lodar's offline root certifies the
# update key, so rotating is not an option). GitHub secrets are write-only.
#
# So this job reads each repo secret inside a run on main and SEALS it to the
# environment's own public key (a libsodium sealed box, exactly what GitHub's
# secrets API expects as `encrypted_value`). The artifact holds ciphertext only:
# GitHub alone holds the private half, so the artifact is safe to download and
# nobody ever handles a key.
#
# WHY THE KEY IS A CONSTANT, NOT A DISPATCH INPUT. Whoever chooses the public key
# can open the artifact. Anyone with write access can dispatch on main (that includes
# the app every agent seat pushes through), so a `public_key` input would let them
# pass their OWN key and walk off with both signing keys. The key below can only
# change through a reviewed merge to main, and the job refuses to run while it is
# unset. (A required-reviewer environment was the other option; it was not chosen
# because a reviewer must be a GitHub user and the admin who runs this acts through
# a token, so every dispatch would wait on a click nobody on the team can make.)
#
# THE STEPS (a repo admin runs 1-5):
#   1. Create the `release-signing` environment, deployment branches = main only,
#      then read its public key:
#        gh api repos/5dive-ai/5dive/environments/release-signing/secrets/public-key
#      and merge a PR that sets SEAL_TO_KEY and SEAL_TO_KEY_ID below to its `key`
#      and `key_id` (review it against that output: it is public data).
#   2. Dispatch this workflow ON MAIN (no inputs).
#   3. Download the artifact and PUT each ciphertext (the job summary prints the
#      exact commands).
#   4. PROVE the copies before any delete: dispatch apt-repo and offline-update on
#      main and check their signatures verify against the pinned public keys. The
#      job summary below prints each sealed key's PUBLIC fingerprint to compare.
#      Note offline-update builds UNSIGNED with only a warning when its key is
#      empty, so a green run is not proof: the attached file must be signed.
#   5. Only then delete the two repo-level secrets, and delete this file.
on:
  workflow_dispatch:

env:
  # Step 1 sets both, in a reviewed PR to main. Empty = the job refuses to run.
  SEAL_TO_KEY: ''
  SEAL_TO_KEY_ID: ''

permissions:
  contents: read

jobs:
  seal:
    # Main only: a branch could edit this file to print the keys instead.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Install libsodium bindings (Ubuntu archive)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-nacl

      - name: Seal each repo secret to the environment key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          OFFLINE_UPDATE_SIGNING_KEY: ${{ secrets.OFFLINE_UPDATE_SIGNING_KEY }}
          OUT: ${{ runner.temp }}/sealed
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import base64, os, sys
          from nacl.public import PublicKey, SealedBox
          raw, key_id = os.environ.get("SEAL_TO_KEY", "").strip(), os.environ.get("SEAL_TO_KEY_ID", "").strip()
          if not raw or not key_id:
              sys.exit("SEAL_TO_KEY / SEAL_TO_KEY_ID are unset: step 1 sets them in a reviewed PR to main; this job never takes a key as input")
          pk = base64.b64decode(raw, validate=True)
          if len(pk) != 32:
              sys.exit(f"SEAL_TO_KEY is {len(pk)} bytes, not 32: it must be the `key` field of the environment's public-key response")
          box = SealedBox(PublicKey(pk))
          out = os.environ["OUT"]
          for name in ("APT_SIGNING_KEY", "OFFLINE_UPDATE_SIGNING_KEY"):
              value = os.environ.get(name, "")
              if not value:
                  sys.exit(f"{name} is empty in this run: nothing to copy, and a sealed empty value would erase the real key")
              with open(os.path.join(out, name), "w") as f:
                  f.write(base64.b64encode(box.encrypt(value.encode())).decode())
          with open(os.path.join(out, "key_id"), "w") as f:
              f.write(key_id)
          print("sealed: APT_SIGNING_KEY, OFFLINE_UPDATE_SIGNING_KEY")
          PY

      - name: Public fingerprints of what was sealed (compare in step 4)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          OFFLINE_UPDATE_SIGNING_KEY: ${{ secrets.OFFLINE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import <<<"$APT_SIGNING_KEY"
          apt_fpr="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          upd_pub="$(printf '%s\n' "$OFFLINE_UPDATE_SIGNING_KEY" | openssl pkey -pubout)"
          upd_fpr="$(printf '%s\n' "$upd_pub" | openssl pkey -pubin -outform DER | sha256sum | awk '{print $1}')"
          rm -rf "$GNUPGHOME"
          {
            echo "## Sealed for release-signing (key_id ${SEAL_TO_KEY_ID})"
            echo
            echo "- APT_SIGNING_KEY: OpenPGP fingerprint \`${apt_fpr}\`"
            echo "- OFFLINE_UPDATE_SIGNING_KEY: public key SHA-256 (DER) \`${upd_fpr}\`"
            echo
            echo '```'
            printf '%s\n' "$upd_pub"
            echo '```'
            echo
            echo "Step 3, from the downloaded artifact's folder:"
            echo
            echo '```'
            echo 'for n in APT_SIGNING_KEY OFFLINE_UPDATE_SIGNING_KEY; do'
            echo "  gh api -X PUT repos/${GITHUB_REPOSITORY}/environments/release-signing/secrets/\$n \\"
            echo '    -f encrypted_value="$(cat $n)" -f key_id="$(cat key_id)"'
            echo 'done'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sealed-signing-keys
          path: ${{ runner.temp }}/sealed
          retention-days: 1
          if-no-files-found: error
