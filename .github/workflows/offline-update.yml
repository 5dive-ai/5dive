name: offline-update
# DIVE-7577: the update file a local-only box installs from a USB disk.
# `sudo 5dive self-update --from=/media/usb/5dive-offline-<version>.tar` checks it
# and installs it with no network (src/lib/offline_update.sh).
#
# WHAT A PUBLISH IS. The newest release tag, packaged by
# packaging/offline/build-offline.sh with: that tag's CLI tree, 5dive-plugins
# main WITH every plugin's node_modules (an offline plugin start runs
# `bun install` when they are missing, DIVE-7559), the skills repo main (the
# same two branches every online box pulls), and the bun binary. The manifest
# is signed with ed25519 and the file is attached to the tag's GitHub release.
#
# WHY workflow_run (the same reason as apt-repo.yml): release-cut.yml pushes its
# tag with github.token, which starts no workflow. A tag whose release already
# carries the file is skipped; workflow_dispatch rebuilds one by hand.
# DIVE-8014: release-cut now pushes the tag with a deploy key, and a deploy-key
# push DOES start workflows. Keep workflow_run anyway: it fires after the release
# page exists. And nothing may listen on `push: tags: v*` (the tag ruleset is
# probed with a v* tag on the premise that no workflow fires).
#
# ONE-TIME SETUP, by a repo admin (main/ops), never on a box and never in chat:
#   openssl genpkey -algorithm ed25519 -out offline-update.pem
#   gh secret set OFFLINE_UPDATE_SIGNING_KEY --env release-signing < offline-update.pem
#   (an ENVIRONMENT secret, DIVE-7973 — never a repo secret, which every branch's
#   workflows can read; `release-signing` admits deployments from main only)
#   openssl pkey -in offline-update.pem -pubout   # paste into OFFLINE_UPDATE_PUBKEY_PEM
#                                                 # in src/lib/offline_update.sh, then shred the file
# DIVE-7888: once the owner's offline root key exists, its PUBLIC certificate for
# that signing key goes in packaging/offline/trust/ (README there); a publish then
# embeds it, and boxes that hold the root check it.
# Until the secret exists the file is built UNSIGNED and NOT attached: every box
# refuses an unsigned file, so publishing one would only mislead. That is the
# safe failure, chosen on purpose.
#
# Pull requests that touch this build and check a file signed with a throwaway
# key against the CLI's own verifier, install the USB file (DIVE-7598) on a fresh
# firewalled Ubuntu 24.04, and publish nothing. Not a required check.
on:
  workflow_run:
    workflows: [release-cut]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (vX.Y.Z). Empty = newest.'
        required: false
        type: string
  pull_request:
    paths:
      - 'packaging/offline/**'
      - 'src/lib/offline_update.sh'
      - '.github/workflows/offline-update.yml'

concurrency:
  group: offline-update-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # DIVE-7973: OFFLINE_UPDATE_SIGNING_KEY lives in the `release-signing`
    # environment, whose deployment policy admits main only, so a workflow run
    # from any other branch cannot read it. Pull requests sign with a throwaway
    # key and take no environment (an empty name is none).
    environment: ${{ github.event_name != 'pull_request' && 'release-signing' || '' }}
    permissions:
      contents: write   # attach the file to the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 5dive-ai/5dive-plugins
          ref: main
          path: _plugins
      - uses: actions/checkout@v4
        with:
          repository: 5dive-ai/skills
          ref: main
          path: _skills
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, pinned to a sha: a third-party tag can be moved (DIVE-7973)

      - name: Pick the tag
        id: p
        env:
          WANT: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          held="$(grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' .release-hold || true)"
          if [[ -n "$WANT" ]]; then
            git rev-parse -q --verify "refs/tags/$WANT" >/dev/null || { echo "::error::no release tag $WANT"; exit 1; }
            tag="$WANT"
          else
            tag="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF -f <(printf '%s\n' "$held") | sort -V | tail -1)"
          fi
          [[ -n "$tag" ]] || { echo "::error::no release tag"; exit 1; }
          publish=false
          case "$EVENT" in
            workflow_dispatch) publish=true ;;
            workflow_run)
              if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "5dive-offline-${tag#v}.tar"; then
                echo "$tag already carries its update file — nothing to publish"
              else publish=true; fi ;;
          esac
          echo "tag: $tag  publish: $publish"
          { echo "tag=$tag"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

      - name: Plugin packages (node_modules in every plugin)
        run: |
          set -euo pipefail
          for d in _plugins/plugins/*/; do
            [[ -f "$d/package.json" ]] || continue
            (cd "$d" && bun install --production --ignore-scripts --no-progress --no-summary)
          done

      - name: Signing key
        env:
          PUBLISH: ${{ steps.p.outputs.publish }}
          OFFLINE_UPDATE_SIGNING_KEY: ${{ secrets.OFFLINE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          k="$RUNNER_TEMP/offline-update.pem"
          if [[ "$PUBLISH" == true ]]; then
            if [[ -z "$OFFLINE_UPDATE_SIGNING_KEY" ]]; then
              echo "::warning::repo secret OFFLINE_UPDATE_SIGNING_KEY is not set — building UNSIGNED and attaching nothing (every box refuses an unsigned file). See this workflow's ONE-TIME SETUP header (DIVE-7577)."
              echo "SIGN_KEY=" >> "$GITHUB_ENV"; exit 0
            fi
            umask 077; printf '%s\n' "$OFFLINE_UPDATE_SIGNING_KEY" > "$k"
          else
            openssl genpkey -algorithm ed25519 -out "$k"
          fi
          openssl pkey -in "$k" -pubout -out "$RUNNER_TEMP/offline-update.pub.pem"
          echo "SIGN_KEY=$k" >> "$GITHUB_ENV"

      - name: Build the file
        env:
          TAG: ${{ steps.p.outputs.tag }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ steps.p.outputs.publish }}
        run: |
          set -euo pipefail
          # DIVE-7888: the offline root's certificate for the REAL signing key,
          # when one is checked in. Only a publish signs with that key.
          trust=""
          if [[ "$PUBLISH" == true && -n "${SIGN_KEY:-}" && -f packaging/offline/trust/signing-key.json ]]; then
            trust="$PWD/packaging/offline/trust"; echo "TRUST_USED=1" >> "$GITHUB_ENV"
          fi
          if [[ "$EVENT" == pull_request ]]; then
            # A PR is graded on ITS tree (the tags predate it): built, and given a
            # throwaway release number the builder accepts.
            git worktree add -q --detach "$RUNNER_TEMP/tree" HEAD
            (cd "$RUNNER_TEMP/tree" && ./build.sh >/dev/null)
            sed -i 's/^readonly FIVE_VERSION="[^"]*"/readonly FIVE_VERSION="0.0.1"/' "$RUNNER_TEMP/tree/5dive"
            # DIVE-7921: the tree's 5dive carries 5dive's REAL offline root, which never
            # certifies a throwaway key. Like the version above, the PR's 5dive gets a
            # throwaway root that certifies this run's throwaway key: the file then takes
            # the whole root chain, on the runner and on the USB box.
            pr_root="$RUNNER_TEMP/pr-root"; mkdir -p "$pr_root/trust"
            openssl genpkey -algorithm ed25519 -out "$pr_root/root.key"
            openssl pkey -in "$pr_root/root.key" -pubout -out "$pr_root/root.pub"
            jq -cjn --arg pk "$(cat "$RUNNER_TEMP/offline-update.pub.pem")" \
              --arg id "$(openssl pkey -in "$SIGN_KEY" -pubout -outform DER | sha256sum | awk '{print $1}')" \
              --argjson na "$(( $(date +%s) + 86400 ))" \
              '{format:1,kind:"5dive-signing-key",key_id:$id,pubkey:$pk,not_after:$na}' > "$pr_root/trust/signing-key.json"
            printf '{"format":1,"kind":"5dive-revocations","serial":1,"revoked":[]}' > "$pr_root/trust/revoked.json"
            for c in signing-key revoked; do
              openssl pkeyutl -sign -inkey "$pr_root/root.key" -rawin -in "$pr_root/trust/$c.json" -out "$pr_root/trust/$c.sig"
            done
            python3 - "$RUNNER_TEMP/tree/5dive" "$pr_root/root.pub" <<'PY'
          import re, sys
          path, root = sys.argv[1], open(sys.argv[2]).read().rstrip("\n")
          src = open(path).read()
          src, n = re.subn(r"^OFFLINE_UPDATE_ROOT_PUBKEY_PEM='[^']*'$",
                           lambda m: "OFFLINE_UPDATE_ROOT_PUBKEY_PEM='" + root + "'", src, flags=re.M)
          assert n == 1, f"{n} compiled roots in {path}"
          open(path, "w").write(src)
          PY
            trust="$pr_root/trust"; echo "PR_ROOT=$pr_root/root.pub" >> "$GITHUB_ENV"
            # The version rewrite changes 5dive's bytes: re-hash it, or install.sh
            # refuses the bundle on the box ("checksum mismatch", DIVE-7598).
            sha256sum "$RUNNER_TEMP/tree/5dive" | awk '{print $1}' > "$RUNNER_TEMP/tree/5dive.sha256"
          else
            git worktree add -q --detach "$RUNNER_TEMP/tree" "$TAG"
          fi
          f="$(OFFLINE_TRUST_DIR="$trust" bash packaging/offline/build-offline.sh "$RUNNER_TEMP/tree" _plugins _skills "$(command -v bun)" "$RUNNER_TEMP/out" ${SIGN_KEY:+"$SIGN_KEY"})"
          ls -la "$f"
          echo "OFFLINE_FILE=$f" >> "$GITHUB_ENV"

      - name: Arm — the CLI's verifier accepts it, and refuses it altered
        if: env.SIGN_KEY != ''
        run: |
          set -euo pipefail
          eval "$(sed -n '/^version_lt() {/,/^}/p' src/cmd_selfupdate.sh)"
          warn() { echo "warn: $*" >&2; }
          . src/lib/offline_update.sh
          export OFFLINE_UPDATE_PUBKEY_FILE="$RUNNER_TEMP/offline-update.pub.pem" OFFLINE_UPDATE_STATE_DIR="$RUNNER_TEMP/ou-state"
          # A file built without the root's certificate is checked by the pinned key (DIVE-7888).
          # A PR's file is certified by the PR's throwaway root (DIVE-7921).
          if [[ -n "${PR_ROOT:-}" ]]; then
            OFFLINE_UPDATE_ROOT_PUBKEY_PEM="$(cat "$PR_ROOT")"; export OFFLINE_UPDATE_ROOT_PUBKEY_FILE="$RUNNER_TEMP/no-root.pem"
          elif [[ -z "${TRUST_USED:-}" ]]; then
            OFFLINE_UPDATE_ROOT_PUBKEY_PEM=''; export OFFLINE_UPDATE_ROOT_PUBKEY_FILE="$RUNNER_TEMP/no-root.pem"
          fi
          st="$(mktemp -d)"
          _ou_verify "$OFFLINE_FILE" "$st" 0.0.0 0 || { echo "::error::the built file is refused: $_OU_WHY"; exit 1; }
          echo "accepted: version $_OU_VERSION"
          bad="$(mktemp -d)"; tar -xf "$OFFLINE_FILE" -C "$bad"
          printf x >> "$bad/payload/bun"
          tar --no-recursion -cf "$RUNNER_TEMP/bad.tar" -C "$bad" manifest.json manifest.sig payload/bun payload/cli.tar.gz payload/plugins.tar.gz payload/skills.tar.gz
          st2="$(mktemp -d)"
          if _ou_verify "$RUNNER_TEMP/bad.tar" "$st2" 0.0.0 0; then echo "::error::an altered file was accepted"; exit 1; fi
          echo "altered file refused: $_OU_WHY"
          # DIVE-7665: the file is gzipped whole; one changed byte of the gzip stream is refused too.
          [[ "$(head -c2 "$OFFLINE_FILE" | od -An -tx1 | tr -d ' ')" == 1f8b ]] || { echo "::error::the update file is not gzipped"; exit 1; }
          cp "$OFFLINE_FILE" "$RUNNER_TEMP/badgz.tar"
          python3 -c 'import sys;p=sys.argv[1];b=bytearray(open(p,"rb").read());b[len(b)//2]^=0xff;open(p,"wb").write(b)' "$RUNNER_TEMP/badgz.tar"
          st3="$(mktemp -d)"
          if _ou_verify "$RUNNER_TEMP/badgz.tar" "$st3" 0.0.0 0; then echo "::error::a file with its gzip altered was accepted"; exit 1; fi
          echo "altered gzip refused: $_OU_WHY"
          echo "update file: $(( $(stat -c %s "$OFFLINE_FILE") / 1048576 )) MiB"

      # ---- DIVE-7598: the USB file that installs a NEW server with no internet ----
      # 5dive-usb-<version>.run = packaging/offline/usb-install.sh + the signed
      # update file + the .deb files a fresh Ubuntu 24.04 may lack (install.sh's
      # APT_PKGS and openssl, with their dependencies, as a clean ubuntu:24.04
      # downloads them). Claude Code is NOT in it (its licence is "All rights
      # reserved"); the owner adds Anthropic's own two files to the stick.
      - name: USB file — system packages
        if: env.SIGN_KEY != ''
        id: usb
        run: |
          set -euo pipefail
          bundle="$(tar -xOf "$OFFLINE_FILE" payload/cli.tar.gz | tar -xzO ./5dive)"
          if ! grep -q '^cmd_usb_install()' <<<"$bundle"; then
            echo "::warning::this tag's 5dive predates the USB install (DIVE-7598) — no USB file for it"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pkgs="$(sed -n 's/^APT_PKGS="\(.*\)"$/\1/p' "$RUNNER_TEMP/tree/install.sh") openssl"
          [[ "$pkgs" == *jq* ]] || { echo "::error::APT_PKGS not found in install.sh"; exit 1; }
          install -d "$RUNNER_TEMP/debs"
          docker run --rm -v "$RUNNER_TEMP/debs:/out" -e PKGS="$pkgs" ubuntu:24.04 bash -euo pipefail -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --download-only --no-install-recommends $PKGS >/dev/null
            cp /var/cache/apt/archives/*.deb /out/
            cd /out && apt-get download $PKGS >/dev/null'   # the named ones even when the image has them
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/debs"
          du -sh "$RUNNER_TEMP/debs"; ls "$RUNNER_TEMP/debs" | wc -l
          { echo "build=true"; echo "pkgs=$pkgs"; } >> "$GITHUB_OUTPUT"

      - name: USB file — build
        if: steps.usb.outputs.build == 'true'
        env:
          PKGS: ${{ steps.usb.outputs.pkgs }}
        run: |
          set -euo pipefail
          f="$(bash packaging/offline/build-usb.sh "$OFFLINE_FILE" "$RUNNER_TEMP/debs" "$PKGS" "$RUNNER_TEMP/usb")"
          ls -la "$f"; cat "$f.sha256"
          echo "USB file: $(( $(stat -c %s "$f") / 1048576 )) MiB"
          echo "USB_FILE=$f" >> "$GITHUB_ENV"

      # The proof (arm 2): a fresh Ubuntu 24.04 system container, booted with
      # systemd, holding only what a minimal server has (no jq, git, tmux,
      # sqlite3, cron…). Every new packet that leaves it for anything but its
      # own network is logged and dropped from BEFORE the install to the end,
      # and the count must stay 0. Anthropic's Claude Code files sit on the
      # "stick" beside the .run, as the guide says. Then local-only off: the
      # office chat page must still answer (DIVE-7598 item 5).
      - name: USB file — install on a fresh server with no internet
        if: steps.usb.outputs.build == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          stick="$RUNNER_TEMP/stick"; install -d "$stick"
          cp "$USB_FILE" "$stick/"
          v="$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)"
          curl -fsSL -o "$stick/manifest.json" "https://downloads.claude.ai/claude-code-releases/$v/manifest.json"
          curl -fsSL -o "$stick/claude" "https://downloads.claude.ai/claude-code-releases/$v/linux-x64/claude"
          printf '%s\n' 'FROM ubuntu:24.04' \
            'RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd systemd-sysv dbus iproute2 nftables sudo ca-certificates curl >/dev/null && apt-get clean' \
            > "$RUNNER_TEMP/Dockerfile"
          docker build -q -t usbbox "$RUNNER_TEMP" >/dev/null
          docker run -d --name usbbox --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock \
            -v "$stick:/media/usb:ro" usbbox /sbin/init >/dev/null
          st=""
          for i in $(seq 60); do st="$(docker exec usbbox systemctl is-system-running 2>/dev/null || true)"; [[ "$st" == running || "$st" == degraded ]] && break; sleep 2; done
          echo "box: $st"
          box() { docker exec usbbox bash -c "$1"; }
          box 'for p in jq git tmux sqlite3 cron; do command -v $p >/dev/null && echo "box already has $p"; done; true'
          net="$(box "ip -4 -o addr show eth0 | awk '{print \$4}'")"; echo "office network: $net"
          printf '%s\n' 'table inet usb7598 {' '  counter dropped_out { }' '  chain output {' \
            '    type filter hook output priority filter; policy accept;' \
            '    oifname "lo" accept' "    ip daddr $net accept" '    ct state established,related accept' \
            '    udp dport 53 log group 7598' \
            '    log prefix "USB7598-DROP " level warn flags skuid' '    counter name dropped_out' '    drop' '  }' '}' \
            > "$RUNNER_TEMP/egress.nft"
          docker cp "$RUNNER_TEMP/egress.nft" usbbox:/root/egress.nft
          box 'nft -f /root/egress.nft && nft list table inet usb7598 | head -3'
          # The drop log comes from the box's own network namespace: let the
          # kernel print it, so a dropped packet names its sender (uid) and target.
          sudo sysctl -qw net.netfilter.nf_log_all_netns=1 || true
          # A dropped DNS query is also copied to nflog group 7598; tcpdump reads
          # it inside the box's network namespace, so the log names the host asked for.
          command -v tcpdump >/dev/null || sudo apt-get install -y -qq tcpdump >/dev/null || true
          bpid="$(docker inspect -f '{{.State.Pid}}' usbbox)"
          sudo nsenter -t "$bpid" -n timeout 1200 tcpdump -i nflog:7598 -n -l -s0 2>&1 | tee "$RUNNER_TEMP/dns.log" >/dev/null &
          sleep 1
          if [[ "$EVENT" == pull_request ]]; then
            # A PR's file is signed with a throwaway key: the box trusts it for
            # this install, and install.sh must then pin 5dive's REAL key over it.
            docker cp "$RUNNER_TEMP/offline-update.pub.pem" usbbox:/root/pr.pem
            box 'install -d /etc/5dive && install -m 644 /root/pr.pem /etc/5dive/update-pubkey.pem'
          fi
          run="/media/usb/$(basename "$USB_FILE")"
          fail=0
          box "bash $run" > "$RUNNER_TEMP/usb-install.log" 2>&1 || { echo "::error::the USB install failed"; fail=1; }
          tail -40 "$RUNNER_TEMP/usb-install.log"
          drops() { box 'nft list counter inet usb7598 dropped_out' | grep -oE 'packets [0-9]+' | awk '{print $2}'; }
          d="$(drops)"; echo "outside packets dropped during the install: $d"
          [[ "$d" == 0 ]] || { echo "::error::the USB install tried to reach outside its network ($d packets)"; sudo dmesg | grep USB7598-DROP | tail -20 || true; box 'cat /etc/resolv.conf' || true; echo "--- DNS queries it tried ---"; cat "$RUNNER_TEMP/dns.log" || true; fail=1; }
          (( fail == 0 )) || { echo "--- the whole install log ---"; cat "$RUNNER_TEMP/usb-install.log"; }
          if box 'test -f /etc/5dive/local-only'; then echo "local-only: on"; else echo "::error::local-only is not on"; fail=1; fi
          box '/usr/local/bin/5dive --version' || fail=1
          box 'sudo -u claude -H /home/claude/.local/bin/claude --version' || { echo "::error::Claude Code did not install"; fail=1; }
          want="$(sed -n "/^OFFLINE_UPDATE_PUBKEY_PEM='/,/'\$/p" src/lib/offline_update.sh | sed "s/^OFFLINE_UPDATE_PUBKEY_PEM='//; s/'\$//")"
          if [[ "$(box 'cat /etc/5dive/update-pubkey.pem')" == "$want" ]]; then echo "update key pinned: 5dive's release key"
          else echo "::error::the box does not pin 5dive's release key"; fail=1; fi
          # DIVE-7921: the box pins the offline root its 5dive carries (the PR's throwaway
          # root on a PR, 5dive's real root on a publish).
          # Extract ./5dive to files first: an awk that exits early on a pipe cuts tar's
          # write, and pipefail kills the step on its SIGPIPE.
          tar -xOf "$OFFLINE_FILE" payload/cli.tar.gz > "$RUNNER_TEMP/usb-cli.tar.gz"
          tar -xzOf "$RUNNER_TEMP/usb-cli.tar.gz" ./5dive > "$RUNNER_TEMP/usb-5dive"
          want_root="$(awk -v q="'" -v p="OFFLINE_UPDATE_ROOT_PUBKEY_PEM='" '
            function out(l) { if (substr(l, length(l)) == q) { print substr(l, 1, length(l) - 1); exit } print l }
            !on && index($0, p) == 1 { on = 1; out(substr($0, length(p) + 1)); next }
            on { out($0) }' "$RUNNER_TEMP/usb-5dive")"
          if [[ -n "${want_root//[[:space:]]/}" ]]; then
            if [[ "$(box 'cat /etc/5dive/update-root.pem')" == "$want_root" ]]; then echo "update root pinned: the root its 5dive carries"
            else echo "::error::the box does not pin the offline root its 5dive carries"; fail=1; fi
          fi
          box '5dive config local-only check --watch=20' || { echo "::error::local-only check is not fully local"; fail=1; }
          addr="${net%/*}"
          page() { box "curl -sk -o /dev/null -w '%{http_code}' https://$addr:8443/" || true; }
          echo "office chat page (on): $(page)"
          box '5dive config local-only off' | tail -3 || true
          sleep 2
          c="$(page)"; echo "office chat page (after off): $c"
          [[ "$c" =~ ^[234][0-9][0-9]$ ]] || { echo "::error::the office chat stopped answering after local-only off"; fail=1
            # shellcheck disable=SC2016
            box 'systemctl status 5dive-local-chat.service --no-pager -l | head -8; journalctl -u 5dive-local-chat.service --no-pager -n 6; ls -la /etc/5dive/local-chat; systemctl show 5dive-local-chat.service -p LoadCredential -p Environment; systemd-run --wait --pipe -q -p User=5dive-chat -p ProtectSystem=strict -p LoadCredential=cert:/etc/5dive/local-chat/cert.pem sh -c "echo CRED=\$CREDENTIALS_DIRECTORY; ls -la \$CREDENTIALS_DIRECTORY; id"; findmnt /run/credentials; ss -ltnp' || true; }
          d="$(drops)"; echo "outside packets dropped, whole run (off included): $d"
          docker rm -f usbbox >/dev/null
          exit $fail

      - name: Attach to the release
        if: steps.p.outputs.publish == 'true' && env.SIGN_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.p.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$OFFLINE_FILE" --clobber
          if [[ -n "${USB_FILE:-}" ]]; then gh release upload "$TAG" "$USB_FILE" "$USB_FILE.sha256" --clobber; fi

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/offline-update.pem"
