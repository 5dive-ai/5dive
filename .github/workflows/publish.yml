# DIVE-3911: publish the `5dive` Python client to PyPI via Trusted Publishing.
#
# NO API TOKEN EXISTS. PyPI trusts this workflow, in this repo, by OIDC — the
# `id-token: write` permission below is what mints the short-lived credential at
# run time. Nothing secret is stored in the repo, the org, or on any agent box.
#
# Fires only on a tag matching `python-v*`, so cutting a CLI release (`v0.25.x`)
# never publishes to PyPI and vice versa — the two release trains are separate
# on purpose.
name: publish

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Unit arms must pass before anything is uploaded
        working-directory: python
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the whole mechanism: mints the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
