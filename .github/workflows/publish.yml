# DIVE-3911: publish the `5dive` Python client to PyPI via Trusted Publishing.
#
# NO API TOKEN EXISTS. PyPI trusts this workflow, in this repo, by OIDC — the
# `id-token: write` permission below is what mints the short-lived credential at
# run time. Nothing secret is stored in the repo, the org, or on any agent box.
#
# Fires only on a tag matching `python-v*`, so cutting a CLI release (`v0.25.x`)
# never publishes to PyPI and vice versa — the two release trains are separate
# on purpose.
name: publish

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Unit arms must pass before anything is uploaded
        working-directory: python
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the whole mechanism: mints the OIDC token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
