name: copy-count-guard

# DIVE-6998. The READMEs and docs never type how many agents the marketplace
# has: the number moves with every pack added or cut (DIVE-6997 took 36 to 35),
# and a typed one is wrong from that merge on. scripts/copy-count-guard.py reads
# README*.md and docs/**/*.md; a hit fails the job and names the line.
#
# The self-test arm runs first: a typed count must be red and a clean tree
# green, or the scan's verdict is not trusted.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  copy-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test (a typed count is red, a clean tree is green)
        run: python3 scripts/copy-count-guard.py --self-test

      - name: Scan the READMEs and docs
        run: python3 scripts/copy-count-guard.py
