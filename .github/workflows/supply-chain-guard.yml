name: supply-chain-guard
# DIVE-2279. Surfaces the lines in a diff where a hostile change is
# indistinguishable from a legitimate one by any other automated means:
# fetch-to-shell, a new TYPE_INSTALL recipe, or a domain this repo has never
# contacted. It does not judge — it AIMS a human read, because "review this PR"
# gets skimmed and "is cli.devln.ai the right domain" gets checked.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # DIVE-4139 — MERGE QUEUE. Every context in this file that is a REQUIRED status
  # check on main must also fire on `merge_group`, or the queue never receives it:
  # with a queue enabled GitHub evaluates required checks on the temporary
  # `gh-readonly-queue/main/...` merge group, and a required context that never
  # reports there holds the entry until the check-response timeout and then EVICTS
  # it. That failure is silent at the PR — the PR just never merges.
  merge_group:
jobs:
  supply-chain-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the added surface
        env:
          # DIVE-4139: on `merge_group` there is no pull_request context. Empty shas
          # would reach supply-chain-scan.sh as empty args, and its "could not scan"
          # exit 2 is wired to ::error:: + exit 1 below — so an unhandled merge group
          # would not merely skip the audit, it would RED the queue entry.
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          # set +e is LOAD-BEARING: GitHub runs `run:` under `bash -e`, so a
          # findings exit (3) would abort the step before rc is ever read and a
          # FINDING would present as a BUILD FAILURE. That inverts the design —
          # this annotates, it does not block. Caught by this guard failing its
          # own first PR on exit 3.
          set +e
          bash scripts/supply-chain-scan.sh "$BASE_SHA" "$HEAD_SHA" .
          rc=$?
          # 0 = nothing to audit. 3 = findings, ANNOTATE but do not block: the
          # audit is agent-held per lodar's DIVE-2279 answer, not a merge gate.
          # 2 = could not scan, which MUST fail — a scanner that says clean when
          # it could not look is the defect this repo spent 07-28 removing.
          if [ "$rc" = "2" ]; then echo "::error::supply-chain-scan could not scan"; exit 1; fi
          if [ "$rc" = "3" ]; then echo "::warning::supply-chain surface added — audit the lines above before merge"; fi
          exit 0
