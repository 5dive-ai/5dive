name: branch-hygiene

on:
  schedule:
    # DIVE-4138 (lodar, 2026-09-09: "Cleanups are daily and automatic?"): daily,
    # was weekly ('17 5 * * 1'). Cadence alone deletes nothing new -- the widening
    # that does is BRANCH_HYGIENE_ARM_PULLREF_IDENTITY on the apply step below.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete API-confirmed merged branches and run stale-PR handling
        type: boolean
        default: false

permissions: {}

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  merged-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Plan merged-branch cleanup
        if: github.event_name == 'workflow_dispatch' && !inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_PRESERVE: ${{ vars.BRANCH_HYGIENE_PRESERVE }}
        run: scripts/branch-hygiene.sh --dry-run

      # DIVE-4138: the pull-ref-identity widening is armed HERE, in the workflow,
      # not in the script. DIVE-3490 built the predicate and refused to arm it on
      # the unattended path until "its first live output [is] a list a human
      # reads", and said arming must be "a deliberate change to that workflow".
      # That list ran weekly in the stale-digest job below; lodar read the eight
      # branches it named on 2026-09-09 and answered DIVE-4138's tier-2 gate
      # `nightly-for-reviewed-only`. This env var is that deliberate change.
      #
      # What it adds: branches whose head is byte-identical to refs/pull/N/head of
      # their own closed-unmerged PR -- reversible by construction, because GitHub
      # retains pull refs permanently.
      # What it does NOT add: branches that never had a PR, and orphan branches
      # with no common ancestor (the `status` data branch). Those have no recovery
      # ref, so they stay report-only for a human. Remove this env var to disarm.
      - name: Delete API-confirmed merged and pull-ref-recoverable branches
        if: github.event_name == 'schedule' || inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_PRESERVE: ${{ vars.BRANCH_HYGIENE_PRESERVE }}
          BRANCH_HYGIENE_ARM_PULLREF_IDENTITY: '1'
        run: scripts/branch-hygiene.sh --apply

      # A GitHub-hosted runner cannot inspect or remove worktrees on the 5dive
      # VM. DIVE-1527's rollout left 2 residual ordinary directories after
      # permission failures, 15 exact-head-merged worktree registrations, and
      # 7 dangling metadata records for an owner/root follow-up. Keep this
      # visible in every run rather than implying remote-ref cleanup covers the
      # host; open-PR, dirty, detached, and non-matching worktrees stay preserved.
      - name: Report host worktree follow-up
        if: always()
        run: |
          echo '::notice title=Host worktree follow-up::Remote branch cleanup does not clean VM worktrees. DIVE-1527 left 2 residual directories, 15 merged registrations, and 7 dangling records for owner/root cleanup.'
          {
            echo '### Host worktree follow-up'
            echo
            echo 'This hosted workflow cleans remote refs only. DIVE-1527 left 2 residual ordinary directories after permission failures, 15 exact-head-merged worktree registrations, and 7 dangling metadata records for owner/root cleanup. Open-PR, dirty, detached, and non-matching worktrees remain preserved.'
          } >> "$GITHUB_STEP_SUMMARY"

  stale-digest:
    # Read-only daily digest (DIVE-1833): flags unmerged PRs >3d, and classifies
    # every other branch by EVIDENCE that its work landed (DIVE-2394) rather than
    # by age. Never deletes/labels/closes, so it runs on every trigger (including
    # the dry-run dispatch) and is not coupled to the merged-branch delete path.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # DEAD_BRANCH_DAYS is deliberately NOT set here: branch age stopped being a
      # classifier in DIVE-2394, and the script prints a line calling out anyone who
      # still sets it rather than silently ignoring it.
      - name: Flag stale PRs and classify branches by landing evidence
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_PR_DAYS: '3'
        run: scripts/branch-hygiene.sh --report >> "$GITHUB_STEP_SUMMARY"

  stale-pull-requests:
    if: github.event_name == 'schedule' || inputs.apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ github.token }}
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >-
            This pull request has had no activity for 30 days. It will close
            after 14 more inactive days; comment or push to keep it open.
          close-pr-message: >-
            Closing after 14 days with no activity since the stale warning.
            Reopen when the branch is ready to continue.
          exempt-pr-labels: pinned,security,no-stale
          operations-per-run: 100
